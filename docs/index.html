<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rummy Home</title>
    <style>
      :root {
        --ink: #1c1b1f;
        --muted: #49454f;
        --accent: #1b5e4b;
        --bg: #f7f4ef;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(27, 94, 75, 0.12), transparent 40%),
          linear-gradient(180deg, #efe8dc 0%, var(--bg) 100%);
        color: var(--ink);
      }
      main {
        max-width: 480px;
        padding: 32px 24px;
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-family: Georgia, serif;
        color: var(--accent);
        font-size: 2.4rem;
      }
      p {
        color: var(--muted);
        line-height: 1.5;
      }
      a {
        color: var(--accent);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Rummy Home</h1>
      <p>Scorekeeping for home rummy nights.</p>
      <p><a href="./privacy-policy.html">Privacy Policy</a></p>
    </main>
  </body>
</html>
