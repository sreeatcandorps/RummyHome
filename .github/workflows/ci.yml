# EZ Score CI — unit tests + TypeScript, a throw-away local Supabase database with pgTAP and
# concurrency checks, and one readable report per run (job summary + "test-report-*" artifact).
#
# Runs on every push and pull request (any branch) and nightly at 09:00 UTC
# (1 AM Pacific standard time / 2 AM daylight time) against the PR 7 branch and main.
# Nothing here touches the production Supabase project: the database is `supabase start`
# on the runner, destroyed when the job ends. No secrets are needed.
#
# How to read the result: open the run → "Summary" → scroll to "EZ Score test report".
# Or download the "test-report-<branch>" artifact and open report.md.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or full 40-character commit SHA to test (blank = the branch this is run from)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  NODE_VERSION: 22

jobs:
  unit:
    name: Unit tests + tsc (${{ matrix.ref || github.head_ref || github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ github.event_name == 'schedule' && fromJSON('["cursor/ezscore-apk-ready", "main"]') || fromJSON(format('["{0}"]', inputs.ref || '')) }}
    steps:
      # The test tooling (ci/, supabase/config.toml, seed.sql, supabase/tests) always comes from the
      # commit this workflow runs from. For the nightly matrix and manual runs, the app under test
      # (rummy-home3/) is taken from matrix.ref instead, so PR 7 and main can be tested before they
      # carry the tooling themselves.
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        if: matrix.ref != ''
        with:
          ref: ${{ matrix.ref }}
          path: .target
      - name: Put the app under test in place
        if: matrix.ref != ''
        run: |
          rm -rf rummy-home3
          mv .target/rummy-home3 rummy-home3
          git checkout -- rummy-home3/supabase/config.toml rummy-home3/supabase/seed.sql rummy-home3/supabase/tests
          git -C .target log --oneline -1

      - id: meta
        name: Name this run
        run: |
          REF="${{ matrix.ref || github.head_ref || github.ref_name }}"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "slug=$(echo "$REF" | tr '/' '-')" >> "$GITHUB_OUTPUT"
          echo "sha=$(git -C .target rev-parse HEAD 2>/dev/null || git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: rummy-home3/package-lock.json

      - name: Install app dependencies
        working-directory: rummy-home3
        run: npm ci --no-audit --no-fund

      - name: node:test
        working-directory: rummy-home3
        run: |
          mkdir -p ../ci/out/unit
          set +e
          node --import tsx --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=../ci/report/node-test-json-reporter.mjs --test-reporter-destination=../ci/out/unit/tests.jsonl \
            tests/*.test.ts
          echo $? > ../ci/out/unit/tests.status

      - name: tsc --noEmit
        working-directory: rummy-home3
        run: |
          set +e
          npx tsc --noEmit 2>&1 | tee ../ci/out/unit/tsc.txt
          echo "${PIPESTATUS[0]}" > ../ci/out/unit/tsc.status

      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-results-${{ steps.meta.outputs.slug }}
          path: ci/out/unit
          if-no-files-found: error

      - name: Fail the job if anything failed
        run: |
          echo "node:test exit $(cat ci/out/unit/tests.status), tsc exit $(cat ci/out/unit/tsc.status)"
          [ "$(cat ci/out/unit/tests.status)" = 0 ] && [ "$(cat ci/out/unit/tsc.status)" = 0 ]

  db:
    name: Database tests on local Supabase (${{ matrix.ref || github.head_ref || github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ github.event_name == 'schedule' && fromJSON('["cursor/ezscore-apk-ready", "main"]') || fromJSON(format('["{0}"]', inputs.ref || '')) }}
    env:
      # Supabase CLI defaults for the local stack started below; never the hosted project.
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      # The test tooling (ci/, supabase/config.toml, seed.sql, supabase/tests) always comes from the
      # commit this workflow runs from. For the nightly matrix and manual runs, the app under test
      # (rummy-home3/) is taken from matrix.ref instead, so PR 7 and main can be tested before they
      # carry the tooling themselves.
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        if: matrix.ref != ''
        with:
          ref: ${{ matrix.ref }}
          path: .target
      - name: Put the app under test in place
        if: matrix.ref != ''
        run: |
          rm -rf rummy-home3
          mv .target/rummy-home3 rummy-home3
          git checkout -- rummy-home3/supabase/config.toml rummy-home3/supabase/seed.sql rummy-home3/supabase/tests
          git -C .target log --oneline -1

      - id: meta
        name: Name this run
        run: |
          REF="${{ matrix.ref || github.head_ref || github.ref_name }}"
          echo "slug=$(echo "$REF" | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ci/package-lock.json

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start a throw-away local Supabase (Postgres only, no Studio/mail/edge)
        working-directory: rummy-home3
        run: |
          supabase --version
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector 2>&1 | grep -viE 'key|secret|token' || true
          psql "$DB_URL" -tAc "select version()"

      - name: Migrations 001–018 + seed from empty (supabase db reset)
        working-directory: rummy-home3
        run: |
          mkdir -p ../ci/out/db
          set +e
          supabase db reset 2>&1 | tee ../ci/out/db/migrations.txt
          echo "${PIPESTATUS[0]}" > ../ci/out/db/migrations.status
          psql "$DB_URL" -tAc "select count(*) || ' migrations recorded' from supabase_migrations.schema_migrations" | tee -a ../ci/out/db/migrations.txt
          psql "$DB_URL" -tAc "select count(*) || ' seeded profiles' from public.profiles" | tee -a ../ci/out/db/migrations.txt

      - name: Rollbacks 018→013 then re-apply 013–018
        run: |
          set +e
          DB_PSQL="psql $DB_URL" ci/db/replay-rollbacks.sh | tee ci/out/db/rollbacks.tap
          echo "${PIPESTATUS[0]}" > ci/out/db/rollbacks.status

      - name: pgTAP (RLS, privacy, save_round, seat removal 016, seat takeover 017, public scorecard)
        run: |
          set +e
          DB_PSQL="psql $DB_URL" OUT=ci/out/db/pgtap ci/db/run-pgtap.sh
          echo $? > ci/out/db/pgtap.status

      - name: Two-client concurrency (save_round and friends)
        working-directory: ci
        run: |
          npm ci --no-audit --no-fund
          set +e
          node db/concurrency-save-round.mjs | tee out/db/concurrency.tap
          echo "${PIPESTATUS[0]}" > out/db/concurrency.status

      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-results-${{ steps.meta.outputs.slug }}
          path: ci/out/db
          if-no-files-found: error

      - name: Stop the local Supabase
        if: always()
        working-directory: rummy-home3
        run: supabase stop --no-backup || true

      - name: Fail the job if anything failed
        run: |
          for s in migrations rollbacks pgtap concurrency; do echo "$s: exit $(cat ci/out/db/$s.status 2>/dev/null || echo missing)"; done
          for s in migrations rollbacks pgtap concurrency; do [ "$(cat ci/out/db/$s.status 2>/dev/null)" = 0 ] || exit 1; done

  report:
    name: Test report (${{ matrix.ref || github.head_ref || github.ref_name }})
    needs: [unit, db]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ github.event_name == 'schedule' && fromJSON('["cursor/ezscore-apk-ready", "main"]') || fromJSON(format('["{0}"]', inputs.ref || '')) }}
    steps:
      # The test tooling (ci/, supabase/config.toml, seed.sql, supabase/tests) always comes from the
      # commit this workflow runs from. For the nightly matrix and manual runs, the app under test
      # (rummy-home3/) is taken from matrix.ref instead, so PR 7 and main can be tested before they
      # carry the tooling themselves.
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        if: matrix.ref != ''
        with:
          ref: ${{ matrix.ref }}
          path: .target
      - name: Put the app under test in place
        if: matrix.ref != ''
        run: |
          rm -rf rummy-home3
          mv .target/rummy-home3 rummy-home3
          git checkout -- rummy-home3/supabase/config.toml rummy-home3/supabase/seed.sql rummy-home3/supabase/tests
          git -C .target log --oneline -1

      - id: meta
        name: Name this run
        run: |
          REF="${{ matrix.ref || github.head_ref || github.ref_name }}"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "slug=$(echo "$REF" | tr '/' '-')" >> "$GITHUB_OUTPUT"
          echo "sha=$(git -C .target rev-parse HEAD 2>/dev/null || git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: unit-results-${{ steps.meta.outputs.slug }}
          path: ci/out/unit
        continue-on-error: true

      - uses: actions/download-artifact@v4
        with:
          name: db-results-${{ steps.meta.outputs.slug }}
          path: ci/out/db
        continue-on-error: true

      - name: Build the report (job summary + report.md)
        env:
          REPORT_REF: ${{ steps.meta.outputs.ref }}
          REPORT_SHA: ${{ steps.meta.outputs.sha }}
        run: node ci/report/build-report.mjs ci/out

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ steps.meta.outputs.slug }}
          path: |
            ci/out/report.md
            ci/out/report.json
            ci/out/unit
            ci/out/db
          if-no-files-found: error
