# Seed the staging database (ezscore-staging) with the volume population — by hand, from the Actions tab.
# Sree, Nov 23: "can you run the seed step". Build Bot's box cannot open Postgres connections, so the seed runs here.
#
# Needs the repo secret STAGING_DB_URL: the ezscore-staging *transaction pooler* URI (carries the password).
# The script refuses any URL that is not local or the staging project (ci/volume/seed-staging-config.mjs), so this
# can never touch live. The URL is a GitHub secret: masked in logs, never echoed by this workflow or the script.
#
# Inputs:
#   wipe   — "true" removes everything a previous seed created (staging.wipe()) before seeding again, then VACUUM FULLs
#            the big tables so the disk is given back. The script first turns Supabase's read-only mode off for its own
#            session, so a wipe works on a Free project that has hit its 500 MB limit (run 45295537304, Nov 24).
#   scale  — fraction of the full population. 0.5 (default) is what fits the Free plan (≈ 350 MB, ~30 min);
#            1 is the full set (≈ 700 MB — Pro only, ~1 h); 0.1 = 5–6 min; 0.05 = a quick smoke of the generator.
#   size_limit_mb — the plan's disk limit (500 = Free). The script measures the database, refuses before seeding when the
#            estimate for the scale would land within 10 % of it, and stops at 95 % while seeding. 0 turns the check off.
# Output: ci/out/staging-seed/summary.json (counts + the staging test sign-in from the run-book; no keys, no URL) as the
#         artifact "staging-seed-summary" and in the job summary.
name: Seed staging

on:
  workflow_dispatch:
    inputs:
      wipe:
        description: Wipe the previous population first (WIPE=1)
        required: false
        default: false
        type: boolean
      scale:
        description: Population scale (0.5 fits the Free plan; 1 = full set, Pro only)
        required: false
        default: '0.5'
        type: string
      size_limit_mb:
        description: Disk limit of the plan in MB (500 = Free, 0 = no check)
        required: false
        default: '500'
        type: string

permissions:
  contents: read

concurrency:
  group: seed-staging
  cancel-in-progress: false

jobs:
  seed:
    name: Seed ezscore-staging (wipe=${{ inputs.wipe }}, scale=${{ inputs.scale }})
    runs-on: ubuntu-latest
    timeout-minutes: 150   # the 10 % run (Nov 23) took 5.6 min with results at ~0.9 s each; scale 1 is ~55–60 min through the pooler, 0.5 about half
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ci/package-lock.json
      - name: Check the secret is set
        env:
          HAS_URL: ${{ secrets.STAGING_DB_URL != '' }}
        run: |
          if [ "$HAS_URL" != "true" ]; then
            echo "::error::Repo secret STAGING_DB_URL is not set (ezscore-staging transaction pooler URI)."
            exit 1
          fi
      - name: Install ci tooling
        working-directory: ci
        run: npm ci
      - name: Seed
        env:
          DB_URL: ${{ secrets.STAGING_DB_URL }}
          WIPE: ${{ inputs.wipe && '1' || '' }}
          SCALE: ${{ inputs.scale }}
          SIZE_LIMIT_MB: ${{ inputs.size_limit_mb }}
          OUT: ci/out/staging-seed
        run: node ci/volume/seed-staging.mjs
      - name: Summary
        if: always()
        run: |
          if [ -f ci/out/staging-seed/summary.json ]; then
            { echo '## Seed staging'; echo; echo '```json'; cat ci/out/staging-seed/summary.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Seed staging — no summary.json (the seed did not finish)' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-seed-summary
          path: ci/out/staging-seed/summary.json
          if-no-files-found: warn
          retention-days: 30
