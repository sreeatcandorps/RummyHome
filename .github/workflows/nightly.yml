# Nightly device run (PR 17). Since the Nov 18 merge of the PR stack, main carries the app and the
# CI tooling, so the nightly tier runs on main itself. At 09:00 UTC this asks the CI workflow to run
# the nightly tier on TARGET_REF. GITHUB_TOKEN may start workflow_dispatch runs (that event is exempt
# from the "no runs from the token" rule).
#
# To test another branch nightly, edit TARGET_REF — or run CI by hand: Actions → CI →
# Run workflow → tier nightly / prerelease, branch of your choice.
name: Nightly trigger

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      tier:
        description: nightly or prerelease
        required: false
        default: nightly

permissions:
  actions: write

env:
  TARGET_REF: main

jobs:
  kick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TIER: ${{ inputs.tier || 'nightly' }}
        run: |
          gh workflow run ci.yml --repo "${{ github.repository }}" --ref "$TARGET_REF" -f tier="$TIER" -f ref=""
          echo "asked CI to run tier=$TIER on $TARGET_REF"
