# Nightly device run (PR 17). Schedules only fire from the default branch, and main does not carry the
# CI tooling yet (it lives in the PR stack). This file is the one piece that has to be on main: at
# 09:00 UTC it asks the CI workflow to run the nightly tier on the top of the stack. GITHUB_TOKEN may
# start workflow_dispatch runs (that event is exempt from the "no runs from the token" rule).
#
# To change which branch is tested nightly, edit TARGET_REF — or run CI by hand: Actions → CI →
# Run workflow → tier nightly / prerelease, branch of your choice.
name: Nightly trigger

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      tier:
        description: nightly or prerelease
        required: false
        default: nightly

permissions:
  actions: write

env:
  TARGET_REF: cursor/pr17-test-infra-0a03

jobs:
  kick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TIER: ${{ inputs.tier || 'nightly' }}
        run: |
          gh workflow run ci.yml --repo "${{ github.repository }}" --ref "$TARGET_REF" -f tier="$TIER" -f ref=""
          echo "asked CI to run tier=$TIER on $TARGET_REF"
