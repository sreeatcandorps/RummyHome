<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Get EZ Score: Rummy</title>
  <style>
    body { margin: 0; font-family: "Segoe UI", sans-serif; background: #FBF1E1; color: #1B1F1C; }
    main { max-width: 520px; margin: 0 auto; padding: 32px 20px; }
    h1 { color: #17402F; }
    p { font-size: 18px; line-height: 1.45; }
  </style>
</head>
<body>
  <main>
    <h1>EZ Score: Rummy</h1>
    <p id="message">Loading…</p>
    <p id="claim" hidden>Already have the app? <a id="open">Open your sign-up link in the app</a>. Install the app first, then come back and tap it.</p>
  </main>
  <script>
    // Claim links look like .../get?claim=TOKEN. The token is passed to the app only; it is never sent anywhere else.
    const claim = new URLSearchParams(location.search).get('claim');
    if (claim && /^[A-Za-z0-9_-]{22,}$/.test(claim)) {
      document.getElementById('claim').hidden = false;
      document.getElementById('open').href = 'rummy-home3://claim?t=' + encodeURIComponent(claim);
    }
    const ua = navigator.userAgent || '';
    const iphone = /iPhone|iPad|iPod/i.test(ua);
    const android = /Android/i.test(ua);
    const message = document.getElementById('message');
    if (iphone) {
      message.textContent = 'The iPhone app is not up yet. There is no TestFlight or App Store listing. Ask the person who invited you for the Android build, or check back later.';
    } else if (android) {
      message.textContent = 'The Android app is shared as a preview APK until it is on the Play Store. Ask the person who invited you for that file. This page does not collect an email or a phone number.';
    } else {
      message.textContent = 'EZ Score: Rummy is a phone app. On an iPhone it is not available yet. On Android it is shared as a preview APK until the Play Store listing exists.';
    }
  </script>
</body>
</html>
