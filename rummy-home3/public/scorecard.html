<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rummy scorecard</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; font-family: "Segoe UI", sans-serif; background: #FBF1E1; color: #1B1F1C; }
    header { background: #17402F; color: #FBF1E1; padding: 16px 18px 14px; }
    header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    header h1 { margin: 0; font-size: 22px; }
    button.help { background: transparent; color: #FBF1E1; border: 1px solid rgba(251,241,225,.5); border-radius: 999px; width: 32px; height: 32px; font-weight: 700; cursor: pointer; }
    dialog { border: 0; border-radius: 12px; max-width: 420px; }
    dialog p { margin: 0 0 12px; }
    .meta { margin-top: 6px; font-size: 14px; opacity: 0.9; }
    main { padding: 12px; overflow-x: auto; }
    table { border-collapse: collapse; min-width: 100%; background: #fff; border-radius: 12px; }
    th, td { padding: 8px 10px; text-align: center; border-bottom: 1px solid #E7E0D4; font-variant-numeric: tabular-nums; }
    th { background: #F4EFE4; font-size: 13px; }
    th .total { display: block; font-size: 16px; font-weight: 800; }
    td.pos { color: #0E7A43; font-weight: 700; }
    td.neg { color: #8C2F2F; }
    .msg { padding: 24px; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>EZ Score: Rummy</h1>
      <div class="meta" id="meta">Loading…</div>
    </div>
    <button class="help" type="button" aria-label="Help" onclick="document.getElementById('help').showModal()">?</button>
  </header>
  <dialog id="help">
    <p>This page updates on its own. It shows the game number, the start time, every round, and the totals. No login. Anyone with the link can watch.</p>
    <form method="dialog"><button>Close</button></form>
  </dialog>
  <main id="board"></main>
  <script>
    // Filled in at deploy. The repo keeps these tokens. Never commit a real key.
    const PROJECT = '__SUPABASE_URL__';
    const ANON_KEY = '__SUPABASE_ANON_KEY__';
    const params = new URLSearchParams(location.search);
    const token = params.get('t') || '';

    function injected(value) {
      return typeof value === 'string' && value.length > 0 && value.indexOf('__') === -1;
    }

    // Same rule as utils/playerInitials.ts in the app: first keeps HY, later duplicates read H2, H3, in seat order.
    function initials(names) {
      const base = names.map((name) => {
        const words = (name || '').trim().split(/\s+/).filter(Boolean);
        if (!words.length) return '?';
        if (words.length === 1) return words[0].slice(0, 2).toUpperCase().padEnd(2, '?');
        return (words[0][0] + words[words.length - 1][0]).toUpperCase();
      });
      const taken = new Set(base);
      const seen = new Set();
      return base.map((label) => {
        if (!seen.has(label)) { seen.add(label); return label; }
        let n = 2;
        while (taken.has(label[0] + n)) n += 1;
        const next = label[0] + n;
        taken.add(next); seen.add(next);
        return next;
      });
    }

    function render(card) {
      const players = card.players || [];
      const names = players.map((player) => player.name);
      const labels = initials(names);
      const byName = new Map(players.map((player, index) => [player.name, index]));
      const rounds = new Set();
      const grid = players.map(() => ({}));
      (card.scores || []).forEach((score) => {
        if (!score.name || score.type === 'expense') return;
        rounds.add(score.round);
        const index = byName.get(score.name);
        if (index == null) return;
        grid[index][score.round] = (grid[index][score.round] || 0) + score.value;
      });
      const roundList = [...rounds].sort((a, b) => a - b);
      const totals = grid.map((row) => roundList.reduce((sum, round) => sum + (row[round] || 0), 0));
      const started = new Date(card.startedAt);
      const when = Number.isNaN(started.getTime()) ? card.startedAt : started.toLocaleString();
      const fromCard = card.gameNumber != null && /^\d+$/.test(String(card.gameNumber)) ? 'G' + card.gameNumber : '';
      const fromLink = /^\d+$/.test(params.get('g') || '') ? 'G' + params.get('g') : '';
      const gameNo = fromCard || fromLink;
      const status = card.status === 'completed' ? 'Completed' : 'Live';
      document.getElementById('meta').textContent = [gameNo, 'Started ' + when, status].filter(Boolean).join(' · ');
      const head = labels.map((label, index) => '<th>' + label + '<span class="total">' + totals[index] + '</span></th>').join('');
      const body = roundList.map((round) => {
        const cells = grid.map((row) => {
          const value = row[round] || 0;
          const cls = value > 0 ? 'pos' : value < 0 ? 'neg' : '';
          return '<td class="' + cls + '">' + (value > 0 ? '+' + value : value) + '</td>';
        }).join('');
        return '<tr><td>' + round + '</td>' + cells + '</tr>';
      }).join('');
      const totalCells = totals.map((value) => '<td class="' + (value > 0 ? 'pos' : value < 0 ? 'neg' : '') + '">' + (value > 0 ? '+' + value : value) + '</td>').join('');
      const sum = totals.reduce((total, value) => total + value, 0);
      const totalRow = roundList.length ? '<tr><td>Total</td>' + totalCells + '</tr>' : '';
      document.getElementById('board').innerHTML = '<table><thead><tr><th>Rnd</th>' + head + '</tr></thead><tbody>' + (body || '<tr><td colspan="8">No rounds yet.</td></tr>') + totalRow + '</tbody></table><p class="meta">Totals add to ' + sum + '</p>';
    }

    async function load() {
      if (!/^[0-9a-f]{48}$/.test(token)) {
        document.getElementById('meta').textContent = 'This scorecard link is not valid.';
        document.getElementById('board').innerHTML = '';
        return;
      }
      if (!injected(PROJECT) || !injected(ANON_KEY)) {
        document.getElementById('meta').textContent = "This scorecard isn't available right now.";
        document.getElementById('board').innerHTML = '';
        return;
      }
      const response = await fetch(PROJECT.replace(/\/$/, '') + '/rest/v1/rpc/public_scorecard', {
        method: 'POST',
        headers: { apikey: ANON_KEY, Authorization: 'Bearer ' + ANON_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ p_token: token }),
      });
      const card = await response.json();
      if (card && card.deleted === true) {
        document.getElementById('meta').textContent = 'This game was deleted.';
        document.getElementById('board').innerHTML = '';
        return;
      }
      if (!card || card.gameId == null) {
        document.getElementById('meta').textContent = 'This scorecard link is not valid.';
        return;
      }
      render(card);
    }

    load().catch(() => {
      document.getElementById('meta').textContent = 'Could not load the scorecard.';
    });
    setInterval(load, 8000);
  </script>
</body>
</html>
