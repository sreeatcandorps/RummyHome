appId: com.mindweavetech.rummyhome
tags: [smoke]
# Game F: 20 players x 30 rounds (supabase/seed-e2e.sql). Header and body must stay in step when
# swiped sideways; the last column (Test Uniform = TU) must be reachable; the header must not clip.
---
- runFlow: ../lib/ensure-signed-in.yaml
- scrollUntilVisible:
    element:
      id: "game-card-GAMEF1"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "game-card-GAMEF1"
- extendedWaitUntil:
    visible: "Scorecard"
    timeout: 20000
- assertVisible: "Round 31"
- assertVisible: "TA"
- takeScreenshot: 10-scorecard-20p
# As few commands as possible: each one re-reads the 600-cell hierarchy (~90 s on the runner).
- scrollUntilVisible:
    element: "TU"
    direction: RIGHT
    speed: 60
    timeout: 180000
- takeScreenshot: 10b-scorecard-20p-scrolled-right
- swipe:
    start: 5%, 40%
    end: 95%, 40%
    duration: 1500
    waitToSettleTimeoutMs: 1000
- scroll
- takeScreenshot: 10c-scorecard-20p-scrolled-down
