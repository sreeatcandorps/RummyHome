appId: com.mindweavetech.rummyhome
tags: [smoke]
# Game F: 20 players x 30 rounds (supabase/seed-e2e.sql). Header and body must stay in step when
# swiped sideways; the last column (Test Uniform = TU) must be reachable; the header must not clip.
---
- runFlow: ../lib/ensure-signed-in.yaml
- scrollUntilVisible:
    element:
      id: "game-card-GAMEF1"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "game-card-GAMEF1"
- extendedWaitUntil:
    visible: "Scorecard"
    timeout: 20000
- assertVisible: "Round 31"
- assertVisible: "TA"
- takeScreenshot: 20-scorecard-20p
- swipe:
    direction: LEFT
    duration: 400
- swipe:
    direction: LEFT
    duration: 400
- swipe:
    direction: LEFT
    duration: 400
- extendedWaitUntil:
    visible: "TU"
    timeout: 5000
- takeScreenshot: 20b-scorecard-20p-scrolled-right
- swipe:
    direction: RIGHT
    duration: 400
- swipe:
    direction: RIGHT
    duration: 400
- swipe:
    direction: RIGHT
    duration: 400
- assertVisible: "TA"
- scroll
- takeScreenshot: 20c-scorecard-20p-scrolled-down
