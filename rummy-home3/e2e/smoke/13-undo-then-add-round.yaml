appId: com.mindweavetech.rummyhome
tags: [smoke]
# PR 2 (035): after Undo, Add round saves the same round number again. Undone rows are no
# longer part of the rounds unique key, and undo is one server step (undo_last_round).
# Fixture: game E (GAMEE1), 4 players, round 1 saved; sree is creator and seated.
---
- runFlow: ../lib/ensure-signed-in.yaml
# Four live games on Home: on the 360-dp phone (font 1.3) game E is below the fold.
- scrollUntilVisible:
    element:
      id: "game-card-GAMEE1"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "game-card-GAMEE1"
- extendedWaitUntil:
    visible: "Scorecard( · .*)?"
    timeout: 15000
- assertVisible: "Round 2"
# D137: Undo is in the ⋮ menu (and in the note after a save), not in the bottom bar.
- assertNotVisible: "Undo round"
- runFlow: ../lib/undo-last-round.yaml
- extendedWaitUntil:
    visible: "Round 1"
    timeout: 15000
- takeScreenshot: pr2-after-undo
- tapOn: "Add round"
- extendedWaitUntil:
    visible: "Save round"
    timeout: 15000
- assertVisible: "Round 1"
- tapOn: "Sree Test, no score"
- tapOn: "Drop -10"
- tapOn: "Harish Test, no score"
- tapOn: "Middle drop -30"
- tapOn: "Zed Zero, no score"
- tapOn: "Drop -10"
- tapOn: "Priya Test, no score"
- tapOn: "Rummy"
- assertVisible: "Balance 0"
- tapOn: "Save round"
- extendedWaitUntil:
    visible:
      text: "Round 2|Round already saved"
    timeout: 20000
- assertNotVisible: "Round already saved"
- assertVisible: "Round 2"
- assertVisible: "Add round"
- takeScreenshot: pr2-round-1-saved-again
