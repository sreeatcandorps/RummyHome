appId: com.mindweavetech.rummyhome
tags: [smoke]
# New game: the picker lists recent players (you first, no "You" tag and no "Registered" tag — PR 7,
# D7.2); Add by initials opens. PR 6 / D112: typing H + T when Harish
# Test already holds HT says "Harish Test is already HT. This new player is HT2." while typing; Save 1 player
# saves HT2 (digit in red) and lists it under "1 player saved and seated"; Done goes back. Leaves one new player
# (HT2) in sree's My players and in the draft; no game is created (creating one would add a live
# game other flows do not expect).
---
- runFlow: ../lib/ensure-signed-in.yaml
- tapOn: "New game"
- extendedWaitUntil:
    visible: "Add by initials"
    timeout: 15000
- assertVisible: "Find in database: add players to this game from the EZ Score database"
- assertVisible: "Add Sree Test (you)"
- assertVisible: "Harish Test"
- assertNotVisible: "You"
- assertNotVisible: "Registered"
- takeScreenshot: 09-new-game
- tapOn: "Add by initials"
- extendedWaitUntil:
    visible: "Row 1 first initial"
    timeout: 15000
# D112: one row to start, the Save bar above the keyboard; a second row appears when the first fills.
- assertVisible: "First-name letter · last-name letter. The cursor moves on by itself."
- assertNotVisible: "Row 2 first initial"
- assertVisible:
    id: "add-players-save"
- takeScreenshot: 09b-add-new-players
- tapOn: "Row 1 first initial"
- inputText: "H"
- inputText: "T"
- assertVisible: "Row 2 first initial"
# The clash shows while typing, before Save (PR 6 sentence, D112).
- assertVisible: "Harish Test is already HT. This new player is HT2."
- assertVisible: "1 ready"
- assertVisible: "Save 1 player"
- tapOn: "Save 1 player"
- extendedWaitUntil:
    visible: ".*1 player saved and seated"
    timeout: 15000
- assertVisible: "Saved HT2"
- assertVisible: "Harish Test is already HT"
- assertNotVisible: "HTE"
- assertVisible: "Edit initials for HT2"
- assertVisible: "Remove HT2 from this game"
- assertNotVisible: ".*Unregistered.*"
- takeScreenshot: 09c-add-new-players-clash-ht2
- tapOn: "Done adding players"
- extendedWaitUntil:
    visible: "Add by initials"
    timeout: 15000
