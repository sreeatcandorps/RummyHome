appId: com.mindweavetech.rummyhome
tags: [smoke]
# New game: the picker lists recent players; Add new players by initials opens and closes.
# No game is created here (creating one would add a live game other flows do not expect).
---
- runFlow: ../lib/ensure-signed-in.yaml
- tapOn: "New game"
- extendedWaitUntil:
    visible: "Add players"
    timeout: 15000
- assertVisible: "Add player from database"
- assertVisible: "Harish Test"
- takeScreenshot: 09-new-game
- tapOn: "Add players"
- extendedWaitUntil:
    visible: "Add New Players by Initials"
    timeout: 15000
- assertVisible: "Row 1 first initial"
- hideKeyboard
- assertVisible: "Done adding players"
- takeScreenshot: 09b-add-new-players
- tapOn: "Done adding players"
- extendedWaitUntil:
    visible: "Add players"
    timeout: 15000
