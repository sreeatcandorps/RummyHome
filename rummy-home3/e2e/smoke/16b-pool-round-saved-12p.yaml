appId: com.mindweavetech.rummyhome
tags: [smoke]
# D139 (design-review-2 §10.6): the Round saved sheet on a 12-seat pool, and re-entry on the dealer's left.
# Fixture: game U (GAMEU1, supabase/seed-e2e.sql), 3 rounds saved. Seats: Sree 1, Test Alpha 2, Bravo 3,
# Charlie 4, Delta 5, Echo 6, Foxtrot 7, Golf..Kilo 8-12 (out in round 1). Alpha..Charlie are at 80, so
# round 4 (Sree Rummy, everyone else Drop 25) puts three out at 105; 40 is the highest still in.
# The seed's rounds keep their dealers (Sree, Alpha, Bravo); since 057 the deal moves anticlockwise, so Alpha
# deals round 4 and, with Alpha out, Sree deals round 5: the dealer's left is the seat after Sree.
# Sree (Nov 21): "what if there are more players, will it scroll?" — eight rows: only the list scrolls,
# the title, the summary and Close stay in view. Two players re-enter from one sheet (it stays open);
# a third from Standings (the second door, the same seat line). Undo takes all of it back at the end.
---
- runFlow: ../lib/ensure-signed-in.yaml
- scrollUntilVisible:
    element:
      id: "game-card-GAMEU1"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "game-card-GAMEU1"
- extendedWaitUntil:
    visible: "Scorecard( · .*)?"
    timeout: 20000
- assertVisible: "12 players"
- tapOn: "Add round"
- extendedWaitUntil:
    visible: "Save round"
    timeout: 15000
- tapOn: "Sree Test, no score"
- tapOn: "Rummy"
- tapOn: "Test Alpha, no score"
- tapOn: "Drop 25"
- tapOn: "Test Bravo, no score"
- tapOn: "Drop 25"
- tapOn: "Test Charlie, no score"
- tapOn: "Drop 25"
# On the 360-dp phone at font 1.3 the last cells can sit below the fold of the grid.
- scrollUntilVisible:
    element:
      text: "Test Delta, no score"
    direction: DOWN
    timeout: 30000
- tapOn: "Test Delta, no score"
- tapOn: "Drop 25"
- scrollUntilVisible:
    element:
      text: "Test Echo, no score"
    direction: DOWN
    timeout: 30000
- tapOn: "Test Echo, no score"
- tapOn: "Drop 25"
- scrollUntilVisible:
    element:
      text: "Test Foxtrot, no score"
    direction: DOWN
    timeout: 30000
- tapOn: "Test Foxtrot, no score"
- tapOn: "Drop 25"
- tapOn: "Save round"
- extendedWaitUntil:
    visible:
      id: "round-saved-sheet"
    timeout: 20000
- assertVisible:
    id: "after-title"
    text: "Round 4 saved"
- assertVisible:
    id: "after-next"
    text: "Next: round 5 · Sree deals"
- assertVisible:
    id: "after-summary"
    text: "3 out this round · 4 still in · re-entry at 41"
- assertVisible: "OUT THIS ROUND"
- assertVisible:
    id: "after-row-00000000-0000-4000-8000-0000000000e1"
- assertVisible:
    id: "after-done"
- takeScreenshot: 16b-round-saved-12p-sheet
# Eight rows (three this round, five earlier): the list scrolls, Close stays pinned.
- scrollUntilVisible:
    element:
      id: "after-row-00000000-0000-4000-8000-0000000000eb"
    direction: DOWN
    timeout: 30000
- assertVisible: "OUT EARLIER"
- assertVisible:
    id: "after-title"
- assertVisible:
    id: "after-done"
- takeScreenshot: 16b2-round-saved-12p-scrolled
- scrollUntilVisible:
    element:
      id: "after-reenter-00000000-0000-4000-8000-0000000000e3"
    direction: UP
    timeout: 30000

# First re-entry: Charlie already sits on Sree's left (the out seats between them are skipped) and keeps seat 4.
- tapOn:
    id: "after-reenter-00000000-0000-4000-8000-0000000000e3"
# The opened row scrolls itself fully into view (CI #183, Pixel 4a font 1.3: Re-enter at 41 was below the
# fold): the flow never scrolls to the button.
- extendedWaitUntil:
    visible: "Re-enter at 41"
    timeout: 5000
- takeScreenshot: 16b3a-round-saved-row-opened
- assertVisible:
    id: "after-seat-line"
    text: "Test Charlie keeps seat 4 — already left of the dealer."
- assertNotVisible:
    id: "after-keep-seat"
- assertVisible: "Re-enter at 41"
- takeScreenshot: 16b3-round-saved-reenter-already-left
- tapOn:
    id: "after-reenter-confirm"
- extendedWaitUntil:
    visible:
      id: "after-back-00000000-0000-4000-8000-0000000000e3"
    timeout: 15000
- assertVisible:
    id: "after-summary"
    text: "2 out this round · 5 still in · re-entry at 42"

# Second re-entry from the same sheet: Golf (out in round 1) moves from seat 8 to Sree's left, seat 2, between
# Sree and Charlie. Sree still deals round 5 (056 keeps the dealer on a re-entry). Bravo would keep seat 3
# (already on Sree's left), so Golf is the one that shows a move.
# Golf's row is in OUT EARLIER, below Charlie's: scroll down to it.
- scrollUntilVisible:
    element:
      id: "after-reenter-00000000-0000-4000-8000-0000000000e7"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "after-reenter-00000000-0000-4000-8000-0000000000e7"
- extendedWaitUntil:
    visible: "Re-enter at 42"
    timeout: 5000
- takeScreenshot: 16b4a-round-saved-second-row-opened
- assertVisible:
    id: "after-seat-line"
    text: "Test Golf sits at seat 2, between Sree and Test Charlie — left of the dealer."
- assertVisible:
    id: "after-keep-seat"
- assertVisible: "Keep seat 8"
- assertVisible: "Re-enter at 42"
- takeScreenshot: 16b4-round-saved-reenter-seat-strip
# A tap on a name in the strip sits him on that person's left, with a warning (never a refusal, D50);
# Keep seat 8 is today's behaviour. The strip shows the seats as planned (Golf at 2, Echo at 7): a tap on
# Echo puts Golf at seat 7, then Sree (seat 1) brings him back to the default.
# The strip scrolls sideways and starts on the player; bring seat 7 into view either way.
- repeat:
    while:
      notVisible:
        id: "after-seat-7"
    times: 3
    commands:
      - swipe:
          from:
            id: "after-seat-strip"
          direction: RIGHT
- repeat:
    while:
      notVisible:
        id: "after-seat-7"
    times: 4
    commands:
      - swipe:
          from:
            id: "after-seat-strip"
          direction: LEFT
- tapOn:
    id: "after-seat-7"
- extendedWaitUntil:
    visible:
      id: "after-seat-warning"
    timeout: 5000
- assertVisible:
    id: "after-seat-line"
    text: "Test Golf sits at seat 7, between Test Echo and Test Foxtrot."
- takeScreenshot: 16b5-round-saved-reenter-other-seat
# The strip scrolls sideways and starts on the player; bring seat 1 into view either way.
- repeat:
    while:
      notVisible:
        id: "after-seat-1"
    times: 3
    commands:
      - swipe:
          from:
            id: "after-seat-strip"
          direction: RIGHT
- repeat:
    while:
      notVisible:
        id: "after-seat-1"
    times: 4
    commands:
      - swipe:
          from:
            id: "after-seat-strip"
          direction: LEFT
- tapOn:
    id: "after-seat-1"
- assertVisible:
    id: "after-seat-line"
    text: "Test Golf sits at seat 2, between Sree and Test Charlie — left of the dealer."
- assertNotVisible:
    id: "after-seat-warning"
- tapOn:
    id: "after-reenter-confirm"
- extendedWaitUntil:
    visible:
      id: "after-back-00000000-0000-4000-8000-0000000000e7"
    timeout: 15000
- assertVisible:
    id: "after-back-00000000-0000-4000-8000-0000000000e7"
    text: "↺ Back in at 42 · seat 2, left of Sree"
- scrollUntilVisible:
    element:
      id: "after-back-00000000-0000-4000-8000-0000000000e3"
    direction: UP
    timeout: 30000
- assertVisible:
    id: "after-back-00000000-0000-4000-8000-0000000000e3"
    text: "↺ Back in at 41 · seat 5, left of Test Golf"
- assertVisible:
    id: "after-next"
    text: "Next: round 5 · Sree deals"
- takeScreenshot: 16b6-round-saved-two-back-in
# Landscape: the same sheet, the list still scrolls under the pinned header and Close.
- setOrientation: LANDSCAPE_LEFT
- extendedWaitUntil:
    visible:
      id: "after-done"
    timeout: 10000
- takeScreenshot: 16b7-round-saved-landscape
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible:
      id: "after-done"
    timeout: 10000
- tapOn:
    id: "after-done"
- extendedWaitUntil:
    visible: "Scorecard( · .*)?"
    timeout: 15000
- runFlow: ../lib/stand-upright.yaml
- assertVisible:
    id: "score-header-initials-2"
    text: "TG"
- assertVisible:
    id: "score-header-initials-5"
    text: "TC"

# The second door: Re-enter in Standings opens the same seat line. Hotel sits on Sree's left, seat 2,
# between Sree and Golf.
# The pane keeps its scroll position, so Hotel's row can be above or below; look up first, then down.
- repeat:
    while:
      notVisible:
        id: "reenter-00000000-0000-4000-8000-0000000000e8"
    times: 4
    commands:
      - swipe:
          from:
            id: "pool-standings-pane"
          direction: DOWN
# Short, slow swipes inside the pane (about one row each): on the small phone the pane shows three rows and a
# full-length swipe flings straight past Hotel to the end of the list.
- repeat:
    while:
      notVisible:
        id: "reenter-00000000-0000-4000-8000-0000000000e8"
    times: 12
    commands:
      - swipe:
          start: 50%, 79%
          end: 50%, 73%
          duration: 700
- tapOn:
    id: "reenter-00000000-0000-4000-8000-0000000000e8"
- extendedWaitUntil:
    visible:
      id: "reentry-sheet"
    timeout: 5000
- assertVisible: "Re-enter Test Hotel"
- assertVisible:
    id: "standings-seat-line"
    text: "Test Hotel sits at seat 2, between Sree and Test Golf — left of the dealer."
- assertVisible: "Re-enter at 43"
- takeScreenshot: 16b8-standings-reenter-seat
- tapOn:
    id: "standings-reenter-confirm"
- extendedWaitUntil:
    notVisible:
      id: "reentry-sheet"
    timeout: 15000
- assertVisible:
    id: "score-header-initials-2"
    text: "TH"
- takeScreenshot: 16b9-standings-reentered

# Clean up: the three re-entries and round 4 come off, newest first, so game U is back to 3 rounds with five
# out (the moved seats stay where they are).
- repeat:
    times: 4
    commands:
      - tapOn: "Undo round"
      - extendedWaitUntil:
          visible: "Remove the last round?"
          timeout: 5000
      - tapOn: "Remove"
      - extendedWaitUntil:
          notVisible: "Remove the last round?"
          timeout: 15000
- extendedWaitUntil:
    visible: "Round 4"
    timeout: 15000
