appId: com.mindweavetech.rummyhome
tags: [smoke]
# PR 9 (D9.2): a result shared from this phone asks before Delete. Open the newest past result
# (G's, saved and restored by smoke/12), share the picture (the Android share sheet opens; Back closes
# it, which still counts as shared), then Delete this result shows "Delete a shared result?" with
# Cancel / Delete. Cancel keeps the result, so nothing changes for the flows after this one.
---
- runFlow: ../lib/ensure-signed-in.yaml
- tapOn: "Results"
- extendedWaitUntil:
    visible: "Results"
    timeout: 15000
# Past results is under the picker; below the fold on the 360-dp phone.
- scrollUntilVisible:
    element:
      text: "Past results"
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Open results from .*"
    direction: DOWN
    timeout: 30000
- tapOn: "Open results from .*"
- extendedWaitUntil:
    visible: "Scores"
    timeout: 20000
- tapOn: "Share"
- extendedWaitUntil:
    visible: "Share results"
    timeout: 10000
- tapOn: "Share results"
# The system share sheet (or the "Image ready." notice when the sheet cannot open) — give it a moment, then Back.
- extendedWaitUntil:
    notVisible: "Share results"
    timeout: 15000
    optional: true
- back
- runFlow:
    when:
      visible: "Close share results"
    commands:
      - tapOn: "Close"
- extendedWaitUntil:
    visible: "Scores"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "result-delete"
    direction: DOWN
    timeout: 30000
# Edge-to-edge draws the last button under the translucent 3-button bar and a tap at the bottom edge
# lands on the system Home button (run 4); centerElement cannot centre an element near the end of the
# page (run 5), so nudge the page up by a third instead. At the very end the screen padding keeps the
# button clear of the bar and the swipe is a no-op.
- swipe:
    start: 50%, 70%
    end: 50%, 40%
- tapOn:
    id: "result-delete"
- extendedWaitUntil:
    visible: "Delete a shared result?"
    timeout: 10000
- assertVisible: "This result was shared from this phone.*"
- assertVisible: "Delete the shared result"
- takeScreenshot: 15-delete-shared-result-confirm
- tapOn: "Keep the result"
- extendedWaitUntil:
    notVisible: "Delete a shared result?"
    timeout: 5000
- assertVisible: "Delete this result"
