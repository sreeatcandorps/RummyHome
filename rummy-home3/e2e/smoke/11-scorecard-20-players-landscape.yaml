appId: com.mindweavetech.rummyhome
tags: [smoke, landscape]
# Game F turned sideways: more columns fit; header stays readable; swipe reaches the last column.
---
- runFlow: ../lib/ensure-signed-in.yaml
- setOrientation: LANDSCAPE_LEFT
- scrollUntilVisible:
    element:
      id: "game-card-GAMEF1"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "game-card-GAMEF1"
- extendedWaitUntil:
    visible: "Scorecard"
    timeout: 20000
- assertVisible: "TA"
- assertVisible: "20 players"
- takeScreenshot: 11-scorecard-20p-landscape
- swipe:
    direction: LEFT
    duration: 400
    waitToSettleTimeoutMs: 1000
- swipe:
    direction: LEFT
    duration: 400
    waitToSettleTimeoutMs: 1000
# PR 4: header and rows are one scroller, so after the swipes the header shows the same columns as the
# rows: a header initial that is visible must have its column of scores under it (checked in full/20).
- takeScreenshot: 11b-scorecard-20p-landscape-right
- setOrientation: PORTRAIT
