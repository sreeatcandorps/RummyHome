appId: com.mindweavetech.rummyhome
tags: [smoke, landscape]
# Game F turned sideways: more columns fit; header stays readable; swipe reaches the last column.
---
- runFlow: ../lib/ensure-signed-in.yaml
- scrollUntilVisible:
    element:
      id: "game-card-GAMEF1"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "game-card-GAMEF1"
- extendedWaitUntil:
    visible: "Scorecard"
    timeout: 20000
- assertVisible: "TA"
- takeScreenshot: 21-scorecard-20p-landscape
- swipe:
    direction: LEFT
    duration: 400
- swipe:
    direction: LEFT
    duration: 400
- extendedWaitUntil:
    visible: "TU"
    timeout: 5000
- takeScreenshot: 21b-scorecard-20p-landscape-right
