appId: com.mindweavetech.rummyhome
tags: [smoke, landscape]
# Game F turned sideways: more columns fit; header stays readable; swipe reaches the last column.
# D89: the table alone — no Share, no ⋮, no Add round, no tags ("20 players" is upright only).
---
- runFlow: ../lib/ensure-signed-in.yaml
- setOrientation: LANDSCAPE_LEFT
- scrollUntilVisible:
    element:
      id: "game-card-GAMEF1"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "game-card-GAMEF1"
- extendedWaitUntil:
    visible:
      id: "score-table"
    timeout: 20000
- assertVisible: "TA"
# Sideways only (the Pixel Tablet's LANDSCAPE_LEFT is upright, where the chrome stays; see smoke/03).
- runFlow:
    when:
      visible:
        id: "landscape-table-only"
    commands:
      - assertNotVisible: "20 players"
      - assertNotVisible: "Add round"
      - assertNotVisible:
          id: "scorecard-share-icon"
      - assertNotVisible: "Scorecard menu"
# PR 10a layout gate (see smoke/10): header and score cell of column 2 visible together.
- assertVisible:
    id: "score-header-2"
- assertVisible:
    id: "score-cell-2-.*"
- takeScreenshot: 11-scorecard-20p-landscape
- swipe:
    direction: LEFT
    duration: 400
    waitToSettleTimeoutMs: 1000
- swipe:
    direction: LEFT
    duration: 400
    waitToSettleTimeoutMs: 1000
# PR 4: header and rows are one scroller, so after the swipes the header shows the same columns as the
# rows: a header initial that is visible must have its column of scores under it (checked in full/20).
- takeScreenshot: 11b-scorecard-20p-landscape-right
- setOrientation: PORTRAIT
