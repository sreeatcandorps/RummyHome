appId: com.mindweavetech.rummyhome
tags: [smoke]
# My players (opened from the Home button since PR 5): the roster with A-Z sections, search, the two add tiles;
# the header's back arrow returns to Home.
---
- runFlow: ../lib/ensure-signed-in.yaml
- tapOn:
    text: "My players.*"
- extendedWaitUntil:
    visible: "Harish Test"
    timeout: 15000
- assertVisible: "Back to Home"
- assertVisible: "Add new players"
- assertVisible: "Find player in database"
- takeScreenshot: 08-my-players
- tapOn: "Search name or player ID"
- inputText: "Pri"
- assertVisible: "Priya Test"
- assertNotVisible: "Harish Test"
- takeScreenshot: 08b-my-players-search
- hideKeyboard
- tapOn: "Back to Home"
- extendedWaitUntil:
    visible: "New game"
    timeout: 15000
