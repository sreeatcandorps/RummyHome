appId: com.mindweavetech.rummyhome
tags: [smoke]
# D124 Sign in with a WhatsApp number and passcode: no message is sent (D76). Wendy Whatsapp (+91 90000 00002,
# passcode 123456, supabase/seed-e2e.sql) has no email. A wrong passcode says so in plain words; the right one
# lands on Home. Profile shows her Sign-in methods (WhatsApp first, Email "Add a backup"). After Log out, Sign in
# starts on WhatsApp, the way last used on this phone (D125). Every tap with the keypad open. Ends with Sree.
---
- clearState
- launchApp
- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 20000
    optional: true
- runFlow:
    when:
      notVisible:
        id: "login-email"
    commands:
      - stopApp
      - launchApp
- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 30000
- tapOn:
    id: "login-way-whatsapp"
- extendedWaitUntil:
    visible:
      id: "login-number"
    timeout: 10000
# The picker: India from the list.
- tapOn:
    id: "login-number-country"
- tapOn:
    id: "login-number-country-IN"
- assertVisible: "Country code, India \\+91. Change"
- tapOn:
    id: "login-number"
- inputText: "9000000002"
- tapOn:
    id: "login-passcode"
- inputText: "000000"
- scrollUntilVisible:
    element:
      id: "login-submit"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    visible: "That number and passcode do not match."
    timeout: 20000
- takeScreenshot: 33a-whatsapp-wrong-passcode
- tapOn:
    id: "login-passcode"
- eraseText: 6
- inputText: "123456"
- scrollUntilVisible:
    element:
      id: "login-submit"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    visible: "New game"
    timeout: 30000
- assertVisible: "Hi Wendy"
- tapOn: "Your profile"
- extendedWaitUntil:
    visible: "Sign-in methods"
    timeout: 15000
- assertVisible: "\\+91 90000 00002"
- assertVisible: "Add a backup"
- assertVisible: "If you lose this number, a backup email is the way back in."
- takeScreenshot: 33b-whatsapp-profile-sign-in-methods
- scrollUntilVisible:
    element: "Log out"
    direction: DOWN
    timeout: 30000
- tapOn: "Log out"
- extendedWaitUntil:
    visible:
      id: "login-number"
    timeout: 20000
- takeScreenshot: 33c-whatsapp-sign-in-last-used
- runFlow:
    file: ../lib/sign-in-as.yaml
    env:
      EMAIL: sree@test.local
