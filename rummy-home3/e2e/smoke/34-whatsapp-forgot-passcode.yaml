appId: com.mindweavetech.rummyhome
tags: [smoke]
# D124 Forgot passcode by WhatsApp: a code to the number, then Set a new passcode, which names the account
# ("This is the account of Farah Forgot · #N. Not you?", spec §5a case 5), then Home signed in. Farah Forgot is
# +91 90000 00003 in supabase/seed-e2e.sql, a test number with the fixed code 123456 (config.toml), so no message
# is sent. The new passcode is then used to sign in. Every tap with the keypad open. Ends with Sree.
---
- clearState
- launchApp
- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 20000
    optional: true
- runFlow:
    when:
      notVisible:
        id: "login-email"
    commands:
      - stopApp
      - launchApp
- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 30000
- tapOn:
    id: "login-way-whatsapp"
- extendedWaitUntil:
    visible:
      id: "login-number"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "login-forgot"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "login-forgot"
- extendedWaitUntil:
    visible:
      id: "forgot-number"
    timeout: 15000
- tapOn:
    id: "forgot-number"
- inputText: "+919000000003"
- scrollUntilVisible:
    element:
      id: "forgot-send"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "forgot-send"
- extendedWaitUntil:
    visible: "Check WhatsApp"
    timeout: 20000
- assertVisible: "We sent a 6-digit code to WhatsApp \\+91 90xxx xx003"
- tapOn:
    id: "forgot-code"
- inputText: "123456"
- scrollUntilVisible:
    element:
      id: "forgot-verify"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "forgot-verify"
# The card follows the keypad so Type it again stays above it; on the small phone that scrolls the title
# "Set a new passcode" off the top, so wait for the new passcode cells instead.
- extendedWaitUntil:
    visible:
      id: "forgot-new-passcode"
    timeout: 20000
- assertVisible: "This is the account of Farah Forgot.*"
- assertVisible: "Not you\\?"
- takeScreenshot: 34a-whatsapp-set-new-passcode
- tapOn:
    id: "forgot-new-passcode"
- inputText: "654321"
- tapOn:
    id: "forgot-confirm-passcode"
- inputText: "654321"
- scrollUntilVisible:
    element:
      id: "forgot-save-passcode"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "forgot-save-passcode"
- extendedWaitUntil:
    visible: "New game"
    timeout: 30000
- assertVisible: "Hi Farah"
# The new passcode works.
- tapOn: "Your profile"
- scrollUntilVisible:
    element: "Log out"
    direction: DOWN
    timeout: 30000
- tapOn: "Log out"
- extendedWaitUntil:
    visible:
      id: "login-number"
    timeout: 20000
- tapOn:
    id: "login-number-country"
- tapOn:
    id: "login-number-country-IN"
- tapOn:
    id: "login-number"
- inputText: "9000000003"
- tapOn:
    id: "login-passcode"
- inputText: "654321"
- scrollUntilVisible:
    element:
      id: "login-submit"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    visible: "New game"
    timeout: 30000
- takeScreenshot: 34b-whatsapp-new-passcode-signed-in
- runFlow:
    file: ../lib/sign-in-as.yaml
    env:
      EMAIL: sree@test.local
