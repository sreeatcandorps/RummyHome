appId: com.mindweavetech.rummyhome
tags: [smoke]
# PR 24 pool feedback on game V (supabase/seed-e2e.sql): a live 13-seat pool, 6 rounds, two re-entries.
# Portrait (Nov 18, Sree's 5-line rule): the card hugs its rounds, at most five round rows tall, with the
# big initials of the Points header (TA, TB … never cut off); the newest round sits at the bottom of the
# card, the Creator / Unique game ID footer is INSIDE the card under it (small italics) and the Standings
# pane takes the rest of the screen, scrolling on its own. The re-entry cells show the re-entry score with the ↺ mark:
# Test Alpha came back for round 3 at the highest (↺20, rule "Highest score" at the time) and Test Bravo
# for round 5 at the highest + 1 (↺41); their cells in the rounds above are grey. A tap on a round
# number opens Edit round. Landscape: the full-width table alone, like Points — no standings (turn the
# phone back for them). Nothing is saved.
---
- runFlow: ../lib/ensure-signed-in.yaml
- scrollUntilVisible:
    element:
      id: "game-card-GAMEV1"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "game-card-GAMEV1"
- extendedWaitUntil:
    visible: "Scorecard( · .*)?"
    timeout: 20000
- assertVisible: "Pool"
- assertVisible: "13 players"
- assertVisible:
    id: "score-header-initials-1"
    text: "ST"
- assertVisible:
    id: "score-header-initials-2"
    text: "TA"
- assertVisible:
    id: "score-header-initials-3"
    text: "TB"
# The re-entry cells: Alpha's round 3 reads ↺20, Bravo's round 5 reads ↺41 (the typed score is kept, not shown).
- assertVisible:
    id: "score-reentry-2"
    text: "(↺20|Re-entered at 20.*)"
- assertVisible:
    id: "score-reentry-3"
    text: "(↺41|Re-entered at 41.*)"
# Five-row card: rounds 2–6 are in view (newest at the bottom), round 1 is scrolled above the card.
- assertVisible:
    id: "score-cell-2-6"
- assertNotVisible:
    id: "score-cell-2-1"
- assertVisible:
    id: "pool-standings-pane"
- assertVisible:
    id: "pool-standings"
- takeScreenshot: 20-pool-13p-portrait
# The card scrolls on its own: up for round 1, down for the Creator / Unique game ID footer inside it.
- swipe:
    from:
      id: "pool-table-pane"
    direction: DOWN
- assertVisible:
    id: "score-cell-2-1"
- swipe:
    from:
      id: "pool-table-pane"
    direction: UP
- swipe:
    from:
      id: "pool-table-pane"
    direction: UP
- extendedWaitUntil:
    visible:
      id: "game-id-footer"
    timeout: 10000
- assertVisible:
    text: "Unique game ID: GAMEV1"
- takeScreenshot: 20b-pool-13p-footer-inside-card
# A tap on the round number edits that round (the re-entry round too).
- tapOn:
    id: "score-round-3"
- extendedWaitUntil:
    visible: "Edit round 3"
    timeout: 15000
- takeScreenshot: 20c-pool-edit-reentry-round
- back
- extendedWaitUntil:
    visible: "Scorecard( · .*)?"
    timeout: 15000
# Landscape: the table keeps the whole width (all 13 columns, TL last); no standings in landscape (Nov 18).
# D89: the table alone — no header, ⋮, Share or bar; D42's re-entry marks stay. The sideways checks run only
# when the screen is sideways: the Pixel Tablet's LANDSCAPE_LEFT stands it upright (#131), where the
# standings, the chrome and the five-column default (D90) are correct.
- setOrientation: LANDSCAPE_LEFT
- extendedWaitUntil:
    visible:
      id: "score-header-initials-2"
    timeout: 15000
- assertVisible:
    id: "score-reentry-2"
- runFlow:
    when:
      visible:
        id: "landscape-table-only"
    commands:
      - assertVisible:
          id: "score-header-initials-8"
          text: "TG"
      - assertVisible:
          id: "score-header-initials-13"
          text: "TL"
      - assertNotVisible:
          id: "pool-standings-pane"
      - assertNotVisible:
          id: "pool-standings"
      - assertNotVisible: "Add round"
      - assertNotVisible: "Scorecard menu"
      - assertNotVisible:
          id: "scorecard-share-icon"
- takeScreenshot: 20d-pool-13p-landscape
- setOrientation: PORTRAIT
# Back in portrait the standings are there again, under the five-row card.
- extendedWaitUntil:
    visible:
      id: "pool-standings-pane"
    timeout: 15000
- assertVisible:
    id: "score-cell-2-6"
- assertNotVisible:
    id: "score-cell-2-1"
- takeScreenshot: 20e-pool-13p-portrait-five-rows
- extendedWaitUntil:
    visible: "Scorecard( · .*)?"
    timeout: 15000
- back
