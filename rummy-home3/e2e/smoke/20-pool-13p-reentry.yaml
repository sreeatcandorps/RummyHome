appId: com.mindweavetech.rummyhome
tags: [smoke]
# PR 24 pool feedback on game V (supabase/seed-e2e.sql): a live 13-seat pool, 6 rounds, two re-entries.
# Portrait: the scorecard takes ~70% with the big initials of the Points header (TA, TB … never cut off),
# the Standings pane sits under it and scrolls on its own, the Creator / Unique game ID footer is INSIDE
# the card under round 6 (small italics). The re-entry cells show the re-entry score with the ↺ mark:
# Test Alpha came back for round 3 at the highest (↺20, rule "Highest score" at the time) and Test Bravo
# for round 5 at the highest + 1 (↺41); their cells in the rounds above are grey. A tap on a round
# number opens Edit round. Landscape: the full-width table with the standings BELOW it (scroll down),
# never side by side. Nothing is saved.
---
- runFlow: ../lib/ensure-signed-in.yaml
- scrollUntilVisible:
    element:
      id: "game-card-GAMEV1"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "game-card-GAMEV1"
- extendedWaitUntil:
    visible: "Scorecard( · .*)?"
    timeout: 20000
- assertVisible: "Pool"
- assertVisible: "13 players"
- assertVisible:
    id: "score-header-initials-1"
    text: "ST"
- assertVisible:
    id: "score-header-initials-2"
    text: "TA"
- assertVisible:
    id: "score-header-initials-3"
    text: "TB"
# The re-entry cells: Alpha's round 3 reads ↺20, Bravo's round 5 reads ↺41 (the typed score is kept, not shown).
- assertVisible:
    id: "score-reentry-2"
    text: "(↺20|Re-entered at 20.*)"
- assertVisible:
    id: "score-reentry-3"
    text: "(↺41|Re-entered at 41.*)"
- assertVisible:
    id: "score-cell-2-1"
- assertVisible:
    id: "pool-standings-pane"
- assertVisible:
    id: "pool-standings"
- takeScreenshot: 20-pool-13p-portrait
# The footer scrolls with the rounds, inside the card.
- scrollUntilVisible:
    element:
      id: "game-id-footer"
    direction: DOWN
    timeout: 10000
- assertVisible:
    text: "Unique game ID: GAMEV1"
- takeScreenshot: 20b-pool-13p-footer-inside-card
# A tap on the round number edits that round (the re-entry round too).
- tapOn:
    id: "score-round-3"
- extendedWaitUntil:
    visible: "Edit round 3"
    timeout: 15000
- takeScreenshot: 20c-pool-edit-reentry-round
- back
- extendedWaitUntil:
    visible: "Scorecard( · .*)?"
    timeout: 15000
# Landscape: the table keeps the whole width (all 13 columns, TL last); the standings follow the rounds in the same scroller.
- setOrientation: LANDSCAPE_LEFT
- extendedWaitUntil:
    visible:
      id: "score-header-initials-8"
    timeout: 15000
- assertVisible:
    id: "score-header-initials-8"
    text: "TG"
- assertVisible:
    id: "score-header-initials-13"
    text: "TL"
- assertNotVisible:
    id: "pool-standings-pane"
- takeScreenshot: 20d-pool-13p-landscape
- scrollUntilVisible:
    element:
      id: "pool-standings"
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: "pool-standings"
- takeScreenshot: 20e-pool-13p-landscape-standings-below
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible: "Scorecard( · .*)?"
    timeout: 15000
- back
