appId: com.mindweavetech.rummyhome
tags: [smoke]
# Results picker and the results page for one completed game (game A, completed by 05-complete-game).
# Nothing is saved here; saving (which closes games) is covered in the full set.
---
- runFlow: ../lib/ensure-signed-in.yaml
- tapOn: "Results"
# The Show results button sits under the list; on the 360-dp phone (font 1.3) it is below the fold.
- extendedWaitUntil:
    visible: "Select .*games"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "game-card-GAMEA1"
    direction: DOWN
    timeout: 15000
- takeScreenshot: 06-results-picker
- scrollUntilVisible:
    element:
      id: "show-results"
    direction: DOWN
    timeout: 15000
# Edge-to-edge draws the last button under the translucent 3-button bar; on the API 34 small phone the tap
# landed on the system Home button and the app went to the launcher (same as flow 12 / 40). Nudge the page
# up first; at the end of the page the swipe is a no-op.
- swipe:
    start: 50%, 70%
    end: 50%, 40%
- assertVisible:
    id: "show-results"
- tapOn:
    id: "show-results"
- extendedWaitUntil:
    visible: "Scores"
    timeout: 20000
- assertVisible:
    text: "\\d+ games? · \\d+ players"
- assertVisible:
    id: "results-save-button"
# PR 8 design: ranked scores split, bordered bands of five games, the games list (below the fold on the 360-dp phone).
- scrollUntilVisible:
    element:
      id: "results-band-table"
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: "results-band-table"
- takeScreenshot: 06b-results-one-game
- scrollUntilVisible:
    element:
      text: "Games in this result"
    direction: DOWN
    timeout: 15000
- takeScreenshot: 06d-results-games-block
# PR 11: ? opens the Results help page at "The preview".
- tapOn: "Help"
- extendedWaitUntil:
    visible: "Help · Results"
    timeout: 5000
- takeScreenshot: 06c-results-help
- back
- extendedWaitUntil:
    notVisible: "Help · Results"
    timeout: 10000
# Back to the top. "Scores" is both the block's label and its title; the block is taller than the 360-dp
# phone's viewport at font 1.3, so a full-visibility match never came — ask for the block by id, part in view.
- scrollUntilVisible:
    element:
      id: "results-totals"
    direction: UP
    visibilityPercentage: 20
    timeout: 25000
- assertVisible:
    text: "\\d+ games? · \\d+ players"
