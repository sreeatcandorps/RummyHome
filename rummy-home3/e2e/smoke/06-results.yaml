appId: com.mindweavetech.rummyhome
tags: [smoke]
# Results picker and the results page for one completed game (game A, completed by 05-complete-game).
# Nothing is saved here; saving (which closes games) is covered in the full set.
---
- runFlow: ../lib/ensure-signed-in.yaml
- tapOn: "Results"
# The Show results button sits under the list; on the 360-dp phone (font 1.3) it is below the fold.
- extendedWaitUntil:
    visible: "Select .*games"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "game-card-GAMEA1"
    direction: DOWN
    timeout: 15000
- takeScreenshot: 06-results-picker
- scrollUntilVisible:
    element:
      id: "show-results"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "show-results"
- extendedWaitUntil:
    visible: "Scores"
    timeout: 20000
- assertVisible:
    text: "\\d+ games? · \\d+ players"
- assertVisible:
    id: "results-save-button"
# PR 8 design: ranked scores split, bordered bands of five games, the games list.
- assertVisible:
    id: "results-band-table"
- takeScreenshot: 06b-results-one-game
- scrollUntilVisible:
    element:
      text: "Games in this result"
    direction: DOWN
    timeout: 15000
- takeScreenshot: 06d-results-games-block
# PR 11: ? opens the Results help page at "The preview".
- tapOn: "Help"
- extendedWaitUntil:
    visible: "Help · Results"
    timeout: 5000
- takeScreenshot: 06c-results-help
- back
- scrollUntilVisible:
    element:
      text: "Scores"
    direction: UP
    timeout: 15000
