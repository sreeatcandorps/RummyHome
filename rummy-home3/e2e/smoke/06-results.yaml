appId: com.mindweavetech.rummyhome
tags: [smoke]
# Results picker and the results page for one completed game (game A, completed by 05-complete-game).
# Nothing is saved here; saving (which closes games) is covered in the full set.
---
- runFlow: ../lib/ensure-signed-in.yaml
- tapOn: "Results"
- extendedWaitUntil:
    visible: "Show results"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "game-card-GAMEA1"
    direction: DOWN
    timeout: 15000
- takeScreenshot: 06-results-picker
- tapOn: "Show results"
- extendedWaitUntil:
    visible: "Scores"
    timeout: 20000
- assertVisible:
    text: "\\d+ games? · \\d+ players"
- assertVisible:
    id: "results-save-button"
# PR 8 design: ranked scores split, bordered bands of five games, the games list.
- assertVisible:
    id: "results-band-table"
- assertVisible: "Games in this result"
- takeScreenshot: 06b-results-one-game
- tapOn: "Help"
# The results help is long and opens scrolled, so wait for a sentence from it rather than the title.
- extendedWaitUntil:
    visible: ".*Nothing is saved by looking.*"
    timeout: 5000
- takeScreenshot: 06c-results-help
- back
- assertVisible: "Scores"
