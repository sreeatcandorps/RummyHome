appId: com.mindweavetech.rummyhome
tags: [smoke]
# PR 8 (migration 034): a completed game with seated players but no saved rounds shows its players
# in a saved result ("1 game · 6 players", every total 0). Before 034 the standings came from score
# rows only and the saved result said "1 game · 0 players". Was known-bugs/pr8; blocking since PR 8.
# Fixture: game G (GAMEG1), completed, 6 seated, 0 rounds, sree creator. Game A is unticked first
# when it is listed (it is Completed and ticked by default once smoke/05 has run). Saving closes G.
---
- runFlow: ../lib/ensure-signed-in.yaml
- tapOn: "Results"
- extendedWaitUntil:
    visible: "Show results"
    timeout: 15000
- runFlow:
    when:
      visible:
        id: "game-card-GAMEA1"
    commands:
      - tapOn:
          id: "game-card-GAMEA1"
- assertVisible:
    id: "game-card-GAMEG1"
- tapOn: "Show results"
- extendedWaitUntil:
    visible: "Scores"
    timeout: 20000
- assertVisible: "1 game · 6 players"
- assertVisible:
    id: "results-band-table"
- assertVisible: "Even: .*"
- takeScreenshot: 12-results-preview-no-rounds
- scrollUntilVisible:
    element:
      text: "Games in this result"
    direction: DOWN
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "results-save-button"
    direction: UP
    timeout: 15000
- tapOn:
    id: "results-save-button"
- extendedWaitUntil:
    visible: "OK, open the saved result"
    timeout: 20000
- tapOn: "OK, open the saved result"
- extendedWaitUntil:
    visible: "Scores"
    timeout: 20000
- takeScreenshot: 12-results-saved-no-rounds
- assertVisible: "1 game · 6 players"
- assertVisible:
    id: "results-band-table"
- scrollUntilVisible:
    element:
      text: "Games in this result"
    direction: DOWN
    timeout: 15000
# PR 9 (words PR 10b): the saved result shows Delete this result at its foot (sree saved it) with
# the one-line consequence under it. Delete → Undo toast → Undo, then Delete again from the result
# page → toast runs out → Deleted + Restore → Restore. G's result is back (G Closed) when this ends.
- scrollUntilVisible:
    element:
      id: "result-delete"
    direction: DOWN
    timeout: 15000
# Edge-to-edge draws the last button under the translucent 3-button bar and a tap at the bottom edge
# lands on the system Home button (run 4); centerElement cannot centre an element near the end of the
# page (run 5), so nudge the page up by a third instead. At the very end the screen padding keeps the
# button clear of the bar and the swipe is a no-op.
- swipe:
    start: 50%, 70%
    end: 50%, 40%
- assertVisible: "Delete this result"
- assertVisible:
    text: ".*back to Completed \\(from Closed\\). Everyone loses this result. You can restore it for 30 days from Settings › Hidden & deleted."
- takeScreenshot: 12c-delete-this-result-button
- tapOn:
    id: "result-delete"
- extendedWaitUntil:
    visible: "Result deleted · .* Completed again"
    timeout: 15000
- assertVisible: "Undo.*"
- takeScreenshot: 12d-deleted-undo-toast
- tapOn: "Undo.*"
# The "Result restored" toast lasts 3 s while the page reloads, and the page keeps its scroll
# position (foot of the page, History in view): the History row is the durable proof.
- extendedWaitUntil:
    visible: ".*Result restored · .* back to Closed.*"
    timeout: 20000
- takeScreenshot: 12e-restored-by-undo
- launchApp
- tapOn: "Results"
- extendedWaitUntil:
    visible: "Past results"
    timeout: 15000
# PR 10b: the Past results rows carry no Delete chip; Delete lives on the result page only. Open
# the row, Delete there, let the 10-second toast run out, then Results → Deleted + Restore.
- scrollUntilVisible:
    element:
      id: "past-result-.*"
    direction: DOWN
    timeout: 10000
- takeScreenshot: 12f-past-results-no-row-delete
- tapOn:
    id: "past-result-.*"
- extendedWaitUntil:
    visible: "Scores"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "result-code"
    direction: DOWN
    timeout: 15000
- assertVisible: "Unique result ID · .*"
- takeScreenshot: 12f2-result-foot-unique-id
- scrollUntilVisible:
    element:
      id: "result-delete"
    direction: DOWN
    timeout: 15000
# Edge-to-edge draws the last button under the translucent 3-button bar and a tap at the bottom edge
# lands on the system Home button (run 4); centerElement cannot centre an element near the end of the
# page (run 5), so nudge the page up by a third instead. At the very end the screen padding keeps the
# button clear of the bar and the swipe is a no-op.
- swipe:
    start: 50%, 70%
    end: 50%, 40%
- tapOn:
    id: "result-delete"
- extendedWaitUntil:
    visible: "Result deleted · .* Completed again"
    timeout: 15000
- takeScreenshot: 12g-deleted-toast-runs-out
- extendedWaitUntil:
    notVisible: "Result deleted · .* Completed again"
    timeout: 20000
- launchApp
- tapOn: "Results"
- extendedWaitUntil:
    visible: "Past results"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "deleted-result-restore-.*"
    direction: DOWN
    timeout: 10000
- assertVisible: "Deleted"
- assertVisible: ".*stay listed for 30 days under \"Deleted\".*"
- takeScreenshot: 12h-past-results-deleted-restore
- tapOn:
    id: "deleted-result-restore-.*"
- extendedWaitUntil:
    visible: "Result restored · its games are Closed again"
    timeout: 15000
- extendedWaitUntil:
    notVisible:
      id: "deleted-result-restore-.*"
    timeout: 20000
- takeScreenshot: 12i-past-results-restored
