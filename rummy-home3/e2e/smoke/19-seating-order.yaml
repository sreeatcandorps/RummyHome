appId: com.mindweavetech.rummyhome
tags: [smoke]
# PR 24 Order of players (was PR 21 Seating order), end to end on the seed, under the D56 countdown, drawn
# as the D138 circle (Sree, Nov 27: "the highest on the top … The second highest goes to the left … The
# dealer is always one step to the right … give him number 1"). Ring position 1 is 12 o'clock (seat N),
# the positions run anticlockwise, the last is seat 1 just right of the top; seat-row-<p> is position p,
# and each disc's label reads "Seat 4, Priya Test" / "Not numbered, Sree Test". A fresh Points game
# (Sree, Harish, Priya, Zed) → Next → Game type → Next → Order of players: nobody numbered, no arrows;
# tapping Priya gives seat 4 (the middle flashes "highest card") and moves her to the top; tapping Priya
# again takes the number back (undo last); an earlier numbered player tapped is selected (▲ ▼ in the
# middle, only for him) and tapped again lets go; numbering everyone (Priya 4, Harish 3, Sree 2, Zed 1)
# marks Zed Dealer and enables Next → the co-admin step → Start game → the scorecard columns follow the
# seats (Zed is column 1). Then ⋮ → Order of players (the full page, prefilled, no arrows at rest) →
# select Zed → ▲ swaps Zed and Sree → Done → columns move and the Log has a Seating row. Clear empties
# the numbers; Cancel changes nothing. Runs after smoke/16 (deletes its game at the end, so no other flow
# sees an extra game); no round is saved, no result. The middle's ~2 s flash is asserted `optional`: a
# slow hierarchy fetch can land after it has gone.
---
- runFlow: ../lib/ensure-signed-in.yaml
- tapOn: "New game"
- extendedWaitUntil:
    visible: "Add by initials"
    timeout: 15000
- tapOn: "Add Sree Test (you)"
- tapOn: "Add Harish Test"
- tapOn: "Add Priya Test"
- tapOn: "Add Zed Zero"
- assertVisible: "Next · 4 players"
- tapOn:
    id: "new-game-next"
- extendedWaitUntil:
    visible: "Game type"
    timeout: 15000
- assertNotVisible:
    id: "start-game"
- scrollUntilVisible:
    element:
      id: "new-game-type-next"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "new-game-type-next"
# Step 3: Order of players. Nobody numbered, discs in pick order from the top, no arrows, Next off.
- extendedWaitUntil:
    visible: "Order of players"
    timeout: 15000
- assertVisible:
    id: "seat-row-1"
    text: "Not numbered, Sree Test"
- assertVisible:
    id: "seat-label-1"
    text: "ST"
- assertVisible:
    id: "seat-row-4"
    text: "Not numbered, Zed Zero"
- assertVisible:
    id: "order-counter"
    text: "0 of 4 numbered"
- assertVisible:
    id: "seat-deal-direction"
- assertVisible: "The deal goes anticlockwise"
- assertNotVisible:
    id: "seat-up-1"
- assertNotVisible:
    id: "seat-selected"
- assertNotVisible:
    id: "seat-deals-next"
- takeScreenshot: 19-order-start-empty
# Tap Priya (highest card): seat 4, glides to 12 o'clock; the middle flashes her name and "highest card".
- tapOn:
    id: "seat-row-3"
- assertVisible:
    id: "seat-highest-card"
    optional: true
- assertVisible:
    id: "seat-flash-name"
    text: "Priya Test"
    optional: true
- takeScreenshot: 19b-order-priya-highest
- assertVisible:
    id: "seat-row-1"
    text: "Seat 4, Priya Test"
- assertVisible:
    id: "seat-number-1"
    text: "4"
- assertNotVisible:
    id: "seat-deals-next"
- assertVisible:
    id: "order-counter"
    text: "1 of 4 numbered"
# Tap Priya again: the latest number comes back off and Priya drops back among the unnumbered.
- tapOn:
    id: "seat-row-1"
- assertVisible:
    id: "order-counter"
    text: "0 of 4 numbered"
- assertVisible:
    id: "seat-row-3"
    text: "Not numbered, Priya Test"
- takeScreenshot: 19c-order-undo-last
# Priya 4, Harish 3. No arrows at rest (D138): tapping Priya (not the latest) selects her — her ▼ in the
# middle, no ▲ on the highest seat — and tapping her again lets go.
- tapOn:
    id: "seat-row-3"
- tapOn:
    id: "seat-row-3"
- assertVisible:
    id: "seat-number-2"
    text: "3"
- assertNotVisible:
    id: "seat-up-2"
- tapOn:
    id: "seat-row-1"
- extendedWaitUntil:
    visible:
      id: "seat-selected-name"
      text: "Priya Test"
    timeout: 10000
- assertVisible:
    id: "seat-down-1"
- assertNotVisible:
    id: "seat-up-1"
- assertNotVisible:
    id: "seat-up-2"
- takeScreenshot: 19c2-order-selected-arrows
- tapOn:
    id: "seat-row-1"
- assertNotVisible:
    id: "seat-selected"
- assertNotVisible:
    id: "seat-down-1"
# Sree 2, Zed 1: Zed is the dealer, one step right of the top.
- tapOn:
    id: "seat-row-3"
- tapOn:
    id: "seat-row-4"
- assertVisible:
    id: "seat-flash-deals"
    text: "Dealer · deals round 1"
    optional: true
- assertVisible:
    id: "order-counter"
    text: "Everyone numbered"
- assertVisible:
    id: "seat-row-1"
    text: "Seat 4, Priya Test"
- assertVisible:
    id: "seat-row-3"
    text: "Seat 2, Sree Test"
- assertVisible:
    id: "seat-row-4"
    text: "Seat 1, Zed Zero, deals next"
- assertVisible:
    id: "seat-number-4"
    text: "1"
- assertVisible:
    id: "seat-deals-next"
    text: "Dealer"
- extendedWaitUntil:
    visible:
      id: "seat-deals-line"
      text: "Zed Zero deals round 1"
    timeout: 10000
# Clear empties the numbers; number them again the same way.
- tapOn:
    id: "new-game-order-clear"
- assertVisible:
    id: "order-counter"
    text: "0 of 4 numbered"
- tapOn:
    id: "seat-row-3"
- tapOn:
    id: "seat-row-3"
- tapOn:
    id: "seat-row-3"
- tapOn:
    id: "seat-row-4"
- assertVisible:
    id: "order-counter"
    text: "Everyone numbered"
- extendedWaitUntil:
    visible:
      id: "seat-deals-line"
    timeout: 10000
- takeScreenshot: 19d-order-everyone-numbered
- tapOn:
    id: "new-game-order-next"
# Step 4: co-admin (Harish and Priya are registered). Start without one.
- extendedWaitUntil:
    visible:
      id: "co-admin-choices"
    timeout: 15000
- takeScreenshot: 19e-coadmin-step
- tapOn:
    id: "start-game"
- extendedWaitUntil:
    visible: "Scorecard( · .*)?"
    timeout: 20000
- assertNotVisible:
    id: "seating-sheet"
# The scorecard columns follow the order: Zed is column 1, Sree column 2.
- assertVisible:
    id: "score-header-initials-1"
    text: "ZZ"
- assertVisible:
    id: "score-header-initials-2"
    text: "ST"
- takeScreenshot: 19f-scorecard-zed-first
# Mid-game path from ⋮: the full page, prefilled (everyone numbered), no arrows at rest, no "rounds played" note yet.
- tapOn: "Scorecard menu"
- tapOn:
    id: "game-menu-seating"
- extendedWaitUntil:
    visible:
      id: "seating-sheet"
    timeout: 15000
- assertVisible: "Order of players"
- assertVisible: "Mid-game · admins only · logged"
- assertNotVisible:
    text: ".*rounds? played.*"
# Prefilled: seat 4 (Priya) at the top, seat 1 (Zed) one step right of it, and Zed deals round 1.
- assertVisible:
    id: "seat-row-1"
    text: "Seat 4, Priya Test"
- assertVisible:
    id: "seat-row-4"
    text: "Seat 1, Zed Zero, deals next"
- assertVisible:
    id: "seat-deals-next"
- assertVisible:
    id: "seat-deals-line"
    text: "Zed Zero deals round 1"
- assertNotVisible:
    id: "seat-up-4"
# D64: prefilled and untouched, the line also says the order is unchanged and Done only closes.
- assertVisible:
    id: "order-counter"
    text: "Everyone numbered · order unchanged — Done closes"
- takeScreenshot: 19g-order-from-menu
# Select Zed (seat 1): ▲ only (seat 1 has no ▼); ▲ swaps Zed and Sree, so Sree is seat 1 and deals.
- tapOn:
    id: "seat-row-4"
- extendedWaitUntil:
    visible:
      id: "seat-selected-name"
      text: "Zed Zero"
    timeout: 10000
- assertNotVisible:
    id: "seat-down-4"
- takeScreenshot: 19g2-order-from-menu-selected
- tapOn:
    id: "seat-up-4"
- assertVisible:
    id: "seat-row-4"
    text: "Seat 1, Sree Test, deals next"
- assertVisible:
    id: "seat-row-3"
    text: "Seat 2, Zed Zero"
- assertVisible:
    id: "seat-up-3"
- tapOn:
    id: "seating-done"
- extendedWaitUntil:
    notVisible:
      id: "seating-sheet"
    timeout: 15000
- assertVisible:
    id: "score-header-initials-1"
    text: "ST"
- assertVisible:
    id: "score-header-initials-2"
    text: "ZZ"
- takeScreenshot: 19h-scorecard-sree-first-again
# Clear then Cancel from the menu changes nothing.
- tapOn: "Scorecard menu"
- tapOn:
    id: "game-menu-seating"
- extendedWaitUntil:
    visible:
      id: "seating-sheet"
    timeout: 15000
- tapOn:
    id: "seating-clear"
- assertVisible:
    id: "order-counter"
    text: "0 of 4 numbered"
- tapOn:
    id: "seat-row-3"
- assertVisible:
    id: "seat-row-1"
    text: "Seat 4, Harish Test"
- takeScreenshot: 19i-order-cleared-one-tap
- tapOn:
    id: "seating-cancel"
- extendedWaitUntil:
    notVisible:
      id: "seating-sheet"
    timeout: 5000
- assertVisible:
    id: "score-header-initials-2"
    text: "ZZ"
# The Log has the mid-game Seating row.
- tapOn: "Scorecard menu"
- tapOn:
    id: "game-menu-log"
- extendedWaitUntil:
    visible:
      id: "game-log-first-row"
    timeout: 15000
- assertVisible:
    text: ".*Seating changed · 1 ST · 2 ZZ.*"
- takeScreenshot: 19j-log-seating-row
- back
- extendedWaitUntil:
    visible: "Scorecard( · .*)?"
    timeout: 15000
# Clean up: the creator deletes the game so Home and the Results picker stay as the other flows expect.
- tapOn: "Scorecard menu"
- tapOn: "Delete game"
- extendedWaitUntil:
    visible: "Delete this game?"
    timeout: 5000
- tapOn: "Delete"
- extendedWaitUntil:
    visible: "New game"
    timeout: 20000
