appId: com.mindweavetech.rummyhome
tags: [smoke]
# D61 the Order of players tutorial, as Ravi Kumar (demo@test.local, seed-listing.sql) — the one
# seeded account that has not seen it (every other profile is flagged in seed-listing.sql). New game
# with Ravi and three of his placeholders → Game type → Next → Order of players: the four-step sheet
# comes up forced (no Cancel, nothing outside closes it): "Everyone draws a card" → Next → "Tap the
# highest card first" → Next → "The last tap deals" → Next → "Wrong tap? Fix it" → Got it. The screen
# shows the one-line how-to with Show me. Tapping the four rows highest to lowest ends with the toast
# "Lowest card — <name> deals round 1" on the last tap. Show me opens the steps again, dismissable;
# Got it closes them. No game is started; the flow signs Sree back in at the end. Runs after smoke/23.
---
- runFlow:
    file: ../lib/sign-in-as.yaml
    env:
      EMAIL: demo@test.local
- tapOn: "New game"
- extendedWaitUntil:
    visible: "Add by initials"
    timeout: 15000
- tapOn: "Add Ravi Kumar (you)"
- tapOn: "Add Anil Reddy"
- tapOn: "Add Kiran Rao"
- tapOn: "Add Meena Iyer"
- assertVisible: "Next · 4 players"
- tapOn:
    id: "new-game-next"
- extendedWaitUntil:
    visible: "Game type"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "new-game-type-next"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "new-game-type-next"
# First time here: the steps come up on their own, forced.
- extendedWaitUntil:
    visible:
      id: "seating-tutorial"
    timeout: 20000
- assertVisible:
    id: "seating-tutorial-title"
    text: "How to seat the table"
- assertVisible:
    id: "seating-tutorial-step-title"
    text: "1  Everyone draws a card"
- assertVisible:
    id: "seating-tutorial-counter"
    text: "1 of 4"
- assertNotVisible:
    id: "seating-tutorial-back"
- assertNotVisible: "Cancel"
- takeScreenshot: 24-tutorial-step-1-draw
- tapOn:
    id: "seating-tutorial-next"
- assertVisible:
    id: "seating-tutorial-step-title"
    text: "2  Tap the highest card first"
- assertVisible:
    id: "seating-tutorial-back"
- takeScreenshot: 24b-tutorial-step-2-highest-first
- tapOn:
    id: "seating-tutorial-next"
- assertVisible:
    id: "seating-tutorial-step-title"
    text: "3  The last tap deals"
- takeScreenshot: 24c-tutorial-step-3-last-tap-deals
- tapOn:
    id: "seating-tutorial-next"
- assertVisible:
    id: "seating-tutorial-step-title"
    text: "4  Wrong tap\\? Fix it"
- assertVisible:
    id: "seating-tutorial-counter"
    text: "4 of 4"
- assertNotVisible:
    id: "seating-tutorial-next"
- takeScreenshot: 24d-tutorial-step-4-fix-it
- tapOn:
    id: "seating-tutorial-done"
- extendedWaitUntil:
    notVisible:
      id: "seating-tutorial"
    timeout: 10000
# The screen under it: one line and Show me, nobody numbered yet.
- assertVisible:
    id: "order-how-to-line"
    text: "Tap players from the highest card to the lowest."
- assertVisible:
    id: "order-how-to-show-me"
- assertVisible:
    id: "order-counter"
    text: "0 of 4 numbered"
- takeScreenshot: 24e-order-one-line-show-me
# Seat the table: the rows are Ravi, Anil, Kiran, Meena in pick order. Highest card first (Meena, row 4),
# then Kiran, then Anil, then Ravi last — the lowest card. The last tap brings the toast.
- tapOn:
    id: "seat-row-4"
- tapOn:
    id: "seat-row-4"
- tapOn:
    id: "seat-row-4"
- assertVisible:
    id: "order-counter"
    text: "3 of 4 numbered"
- tapOn:
    id: "seat-row-4"
- assertVisible:
    id: "order-counter"
    text: "Everyone numbered"
- assertVisible: "Lowest card — you deal round 1"
- takeScreenshot: 24f-order-last-tap-toast
- assertVisible:
    id: "seat-deals-next"
# Show me plays the steps again; this time they can be closed.
- tapOn:
    id: "order-how-to-show-me"
- extendedWaitUntil:
    visible:
      id: "seating-tutorial"
    timeout: 10000
- assertVisible:
    id: "seating-tutorial-counter"
    text: "1 of 4"
- tapOn:
    id: "seating-tutorial-next"
- tapOn:
    id: "seating-tutorial-back"
- assertVisible:
    id: "seating-tutorial-counter"
    text: "1 of 4"
- takeScreenshot: 24g-tutorial-show-me-again
- tapOn:
    id: "seating-tutorial-next"
- tapOn:
    id: "seating-tutorial-next"
- tapOn:
    id: "seating-tutorial-next"
- tapOn:
    id: "seating-tutorial-done"
- extendedWaitUntil:
    notVisible:
      id: "seating-tutorial"
    timeout: 10000
# Help › New game › Order of players has the Watch how button.
- tapOn: "Help"
- extendedWaitUntil:
    visible:
      id: "help-page-new-game"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "help-watch-seating"
    direction: DOWN
    timeout: 15000
- takeScreenshot: 24h-help-watch-how
- tapOn:
    id: "help-watch-seating"
- extendedWaitUntil:
    visible:
      id: "seating-tutorial"
    timeout: 10000
- tapOn:
    id: "seating-tutorial-next"
- tapOn:
    id: "seating-tutorial-next"
- tapOn:
    id: "seating-tutorial-next"
- tapOn:
    id: "seating-tutorial-done"
- extendedWaitUntil:
    notVisible:
      id: "seating-tutorial"
    timeout: 10000
# No game is started. Back to Sree for whatever runs after this flow.
- runFlow:
    file: ../lib/sign-in-as.yaml
    env:
      EMAIL: sree@test.local
