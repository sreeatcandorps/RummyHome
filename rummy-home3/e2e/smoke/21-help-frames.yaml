appId: com.mindweavetech.rummyhome
tags: [smoke]
# Help screenshots (PR 11 follow-up, Sree Nov 18: "go ahead with 3"): the three help pages that had no
# picture — Players · Admins, Hidden & deleted, Sign in. scripts/help-screenshots.mjs turns these
# frames into assets/help/*.png, so each frame is taken in the state the legend describes.
# Fixtures: game E (GAMEE1) for Players · Admins; game H (GAMEH1) is hidden and unhidden again so
# Hidden & deleted shows one row; the sign-in screen comes from a real Log out, then sign-in.yaml
# puts the session back for whatever runs next. Nothing else changes.
---
- runFlow: ../lib/ensure-signed-in.yaml

# 1. Players · Admins of a live game, from the scorecard ⋮.
- scrollUntilVisible:
    element:
      id: "game-card-GAMEE1"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "game-card-GAMEE1"
- extendedWaitUntil:
    visible: "Scorecard( · .*)?"
    timeout: 15000
- tapOn: "Scorecard menu"
- extendedWaitUntil:
    visible: "Players · Admins"
    timeout: 5000
- tapOn: "Players · Admins"
- extendedWaitUntil:
    visible: "Add admin by Player ID"
    timeout: 15000
- assertVisible: "Harish Test"
- assertVisible: "Add new player"
- takeScreenshot: 21-players-admins
- back
- extendedWaitUntil:
    visible: "Add round"
    timeout: 15000
- back
# Home keeps its scroll position across back, so "New game" can sit above the fold (CI run of #117).
- scrollUntilVisible:
    element: "New game"
    direction: UP
    timeout: 15000

# 2. Hidden & deleted with one hidden game: hide game H, open Settings › Hidden & deleted, unhide.
- scrollUntilVisible:
    element:
      id: "game-card-GAMEH1"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "game-card-GAMEH1"
- extendedWaitUntil:
    visible: "Scorecard( · .*)?"
    timeout: 15000
- tapOn: "Scorecard menu"
- extendedWaitUntil:
    visible: "Hide game"
    timeout: 5000
- tapOn: "Hide game"
- scrollUntilVisible:
    element: "New game"
    direction: UP
    timeout: 15000
- tapOn: "Your profile"
# Size-S (#120): Appearance is below the fold at 360 dp × font 1.3; wait for the title, scroll to the row.
- extendedWaitUntil:
    visible: "Profile"
    timeout: 15000
- scrollUntilVisible:
    element: "Appearance"
    direction: DOWN
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "me-settings"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "me-settings"
- extendedWaitUntil:
    visible: "New game starts as"
    timeout: 15000
# Size-S (D67): Hidden & deleted is the last row of the More group, above the Save bar. Scroll to the row
# itself; the bar is fixed, so the row can never be part-hidden under the nav bar.
- scrollUntilVisible:
    element:
      id: "settings-hidden-deleted"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "settings-hidden-deleted"
- extendedWaitUntil:
    visible: "Games I hid · 1"
    timeout: 15000
- assertVisible: "Unhide"
- assertVisible: "Deleted games · .*"
# The third card is below the fold at 360 dp × font 1.3; scroll to it, then back up to the Unhide chip.
- scrollUntilVisible:
    element:
      text: "Deleted results · .*"
    direction: DOWN
    timeout: 10000
- assertVisible: "Deleted results · .*"
- takeScreenshot: 21b-hidden-deleted
- scrollUntilVisible:
    element:
      text: "Unhide"
    direction: UP
    timeout: 10000
- tapOn: "Unhide"
# The state is the proof; the toast is a few seconds long and was gone on the slow 360-dp emulator. The card
# shrinks when its one row leaves, and on the 360-dp phone the header ends up above the viewport: scroll to it.
- extendedWaitUntil:
    notVisible: "Unhide"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Games I hid · 0"
    direction: UP
    timeout: 15000
- assertVisible:
    text: "Back on your Home."
    optional: true
- back
- back
# Profile comes back at the scroll position it was left at (Settings is below Appearance), so wait for the title.
- extendedWaitUntil:
    visible: "Profile"
    timeout: 15000

# 3. The sign-in screen, then sign in again so the session is back for the next flow.
- scrollUntilVisible:
    element: "Log out"
    direction: DOWN
    timeout: 10000
- tapOn: "Log out"
- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 20000
# The email field focuses itself and the keyboard covers the bottom of the card (CI run 1). On the tablet
# (#126 run 45282297377) the keyboard had already closed itself by now, so hideKeyboard's ESCAPE acted as
# Back on the root screen and the app exited: make sure the keyboard is up before asking it to go.
- tapOn:
    id: "login-email"
- waitForAnimationToEnd
- hideKeyboard
- assertVisible: "Forgot passcode?"
# Size-S (#120, D69): the hero card makes the page taller; at 360 dp × font 1.3 the New here? line sits
# under where the keyboard was until the padding settles. Scroll to it rather than assume.
- scrollUntilVisible:
    element:
      text: "Create account"
    direction: DOWN
    timeout: 15000
- assertVisible: "Create account"
- takeScreenshot: 21c-sign-in
- runFlow: ../lib/sign-in.yaml
- assertVisible: "New game"
