appId: com.mindweavetech.rummyhome
tags: [smoke]
# PR 13 Pool, end to end on the seed: New game is four steps (Players → Next → Game type: Pool,
# settings prefilled 101 / 25 / 50 / 130 / Re-entries Unlimited → Next → Order of players → Next →
# co-admin → Start game; PR 24); the pool scorecard (Standings
# card, OUT column, Re-enter); Add round in a pool (plus points, Rummy = 0, "Are you sure?" past the
# Full count, the after-save sheet naming who is out); Complete → Give awards (presets, Custom,
# Save anyway) → the Completed scorecard with the Awards block. Runs last in the smoke set and deletes
# the pool at the end, so no other flow (smoke or full) sees an extra game; no result is saved.
---
- runFlow: ../lib/ensure-signed-in.yaml
- tapOn: "New game"
- extendedWaitUntil:
    visible: "Add by initials"
    timeout: 15000
- tapOn: "Add Sree Test (you)"
- tapOn: "Add Harish Test"
- tapOn: "Add Priya Test"
- tapOn: "Add Zed Zero"
- assertVisible: "Next · 4 players"
- takeScreenshot: 16-new-game-players-next
- tapOn:
    id: "new-game-next"
- extendedWaitUntil:
    visible: "Game type"
    timeout: 15000
- takeScreenshot: 16b-game-type-points
- tapOn:
    id: "game-type-pool"
# Size-S (#120, D68): the grouped Game type is taller; at 360 dp × font 1.3 the Re-entries row is at
# the bottom edge and Unlimited below it. Scroll to the segment, don't assume.
- scrollUntilVisible:
    element:
      text: "Unlimited"
    direction: DOWN
    timeout: 30000
- assertVisible: "Re-entries"
- assertVisible: "Unlimited"
- takeScreenshot: 16c-game-type-pool
# PR 11 mini help: the ⓘ beside Re-entries opens a short pop-up; Got it closes it.
- tapOn: "About Re-entries"
- extendedWaitUntil:
    visible: "Got it"
    timeout: 5000
- assertVisible: ".*Re-entry score says where they start.*"
- takeScreenshot: 16c2-game-type-reentries-tip
- tapOn: "Got it"
- assertNotVisible: "Got it"
# The Settings link and the picked players sit below the fold on a phone.
- scrollUntilVisible:
    element:
      text: "You can also set these defaults in Settings."
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Zed Zero"
    direction: DOWN
    timeout: 30000
- assertVisible: "Sree Test"
- takeScreenshot: 16d-game-type-pool-players
- tapOn:
    id: "new-game-type-next"
# PR 24: Order of players is a step before Start. D56 countdown: tap from the highest card down, the
# last tap is seat 1. Tapping the bottom row four times (Zed, Priya, Harish, Sree) keeps the pick order
# as the seat order: Sree seat 1.
- extendedWaitUntil:
    visible: "Order of players"
    timeout: 15000
- assertVisible:
    id: "order-counter"
    text: "0 of 4 numbered"
- tapOn:
    id: "seat-row-4"
- tapOn:
    id: "seat-row-4"
- tapOn:
    id: "seat-row-4"
- tapOn:
    id: "seat-row-4"
- assertVisible:
    id: "order-counter"
    text: "Everyone numbered"
- takeScreenshot: 16d2-pool-order-of-players
- tapOn:
    id: "new-game-order-next"
# Harish and Priya are registered, so the co-admin step asks once; Start game without one.
- extendedWaitUntil:
    visible:
      id: "co-admin-choices"
    timeout: 15000
- tapOn:
    id: "start-game"
- extendedWaitUntil:
    visible: "Scorecard( · .*)?"
    timeout: 20000
# No pop-up: the order was set before Start.
- assertNotVisible:
    id: "seating-sheet"
- assertVisible: "Pool"
- assertVisible:
    id: "pool-standings"
- assertVisible: "Limit 101 · 100 in, 101 out"
- takeScreenshot: 16d-pool-scorecard-empty

# Round 1: Sree wins (Rummy = 0), Harish drops 25, Priya middle-drops 50, Zed types 135 (> Full count 130 → "Are you sure?").
- tapOn: "Add round"
- extendedWaitUntil:
    visible: "Save round"
    timeout: 15000
- assertNotVisible: "Minus"
- assertNotVisible: "Plus"
- assertVisible: "Drop 25"
- assertVisible: "Middle drop 50"
- assertVisible: "Full count 130"
- takeScreenshot: 16e-pool-add-round-empty
- tapOn: "Sree Test, no score"
- tapOn: "Rummy"
- tapOn: "Harish Test, no score"
- tapOn: "Drop 25"
- tapOn: "Priya Test, no score"
- tapOn: "Middle drop 50"
- tapOn: "Zed Zero, no score"
- tapOn: "1"
- tapOn: "3"
- tapOn: "5"
- extendedWaitUntil:
    visible: "Are you sure?"
    timeout: 5000
- assertVisible: "135 is more than the Full count (130). Keep 135 for this round?"
- takeScreenshot: 16f-pool-are-you-sure
- tapOn: "Keep 135"
- tapOn: "Save score"
- assertVisible: "Zed Zero, score 135, then 135, out"
- takeScreenshot: 16g-pool-round-ready
- tapOn: "Save round"
- extendedWaitUntil:
    visible: "Round saved"
    timeout: 20000
- assertVisible: "Zed Zero is out at 135 (limit 101)."
- assertVisible: "Re-enter Zed"
- takeScreenshot: 16h-pool-after-save-out
# Nov 18: the Round saved sheet closes with Close (Done means Home on a finished game).
- tapOn:
    id: "after-done"
- extendedWaitUntil:
    visible: "Scorecard( · .*)?"
    timeout: 15000
- assertVisible: "OUT R1"
- takeScreenshot: 16i-pool-scorecard-out

# Re-enter Zed from Standings: a new pool's Re-entry score is Highest score + 1 (PR 24), so he comes
# back at 51 (the highest still in is 50) and reads blue. The Re-enter button sits in the standings
# pane under the players still in, so swipe that pane up first (the table pane above scrolls on its own).
- swipe:
    from:
      id: "pool-standings-pane"
    direction: UP
- extendedWaitUntil:
    visible:
      id: "reenter-00000000-0000-4000-8000-000000000008"
    timeout: 5000
- takeScreenshot: 16i2-pool-standings-pane-reenter
- tapOn:
    id: "reenter-00000000-0000-4000-8000-000000000008"
- extendedWaitUntil:
    notVisible: "OUT R1"
    timeout: 15000
- assertVisible: "ZZ Zed Zero, 51, 50 left, 2 drops, re-entered"
- takeScreenshot: 16j-pool-reentered

# Complete the pool (early split): one dialog on the scorecard, then straight on to Awards (Nov 18).
- tapOn: "Complete game"
- extendedWaitUntil:
    visible: "Complete this pool?"
    timeout: 5000
- assertVisible: "1 round will be locked. 4 players in, 0 out. More than one player is still in. Next you give the awards. You can reopen the pool later from the ⋮ menu."
- takeScreenshot: 16k-pool-complete-dialog
- tapOn: "Confirm complete game"
- extendedWaitUntil:
    visible: "By drops left"
    timeout: 20000
- assertVisible: "Awards · .*"
- assertVisible: "101 pool · drop 25 · 4 players · .*"
- assertVisible: "Completed"
- assertVisible: "Not now"
- assertNotVisible: "Awards pending"
- assertNotVisible: "Results"
- takeScreenshot: 16l-pool-awards-from-complete
- assertVisible: "5 entries (a re-entry counts twice) · pool 500 points"
# The "all given out" line is under the table; below the fold on the 360-dp phone at font 1.3.
- scrollUntilVisible:
    element:
      text: "Pool 500 · all given out"
    direction: DOWN
    timeout: 30000
- assertVisible: "Pool 500 · all given out"
# D128: in this pool the others' drop entries would leave the winner with less than them, so By drops left is
# off and Split evenly is picked; the line under the chips says why.
- scrollUntilVisible:
    element:
      id: "award-drops-off"
    direction: UP
    timeout: 30000
- assertVisible: "By drops left is off here: .* Picked for you: Split evenly\\."
- takeScreenshot: 16m-awards-split-evenly-picked
- scrollUntilVisible:
    element:
      id: "award-preset-left"
    direction: UP
    timeout: 30000
- tapOn:
    id: "award-preset-left"
- scrollUntilVisible:
    element:
      text: "Pool 500 · all given out"
    direction: DOWN
    timeout: 30000
- assertVisible: "Pool 500 · all given out"
- takeScreenshot: 16n-awards-by-score-left
# F13.23: By drops left stays greyed; a tap is refused with the pop-up and the selection stays on By score left.
- scrollUntilVisible:
    element:
      id: "award-preset-drops"
    direction: UP
    timeout: 30000
- tapOn:
    id: "award-preset-drops"
- extendedWaitUntil:
    visible: "This is not ideal for this situation because the winner gets less than the others. Please pick another option."
    timeout: 5000
- takeScreenshot: 16o-awards-by-drops-left-not-viable
- tapOn:
    id: "award-not-viable-ok"
- assertNotVisible: "Not for this pool"
- scrollUntilVisible:
    element:
      text: "Pool 500 · all given out"
    direction: DOWN
    timeout: 30000
- assertVisible: "Pool 500 · all given out"
# Custom starts from the numbers on screen: back to Split evenly first (125 each), then Sree's 125 becomes 0.
# (On the 360-dp phone the chips and the table are never on screen together: scroll to each.)
- scrollUntilVisible:
    element:
      id: "award-preset-even"
    direction: UP
    timeout: 30000
- tapOn:
    id: "award-preset-even"
- tapOn:
    id: "award-preset-custom"
- scrollUntilVisible:
    element:
      id: "award-gets-00000000-0000-4000-8000-000000000001"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "award-gets-00000000-0000-4000-8000-000000000001"
# One character per step: fast typing into the controlled field doubled characters on the emulator.
- eraseText
- inputText: "0"
# One hideKeyboard only: a second one with the keyboard already closed acts as Back on Android and
# leaves the Awards page.
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Pool 500 · 375 given out · 125 not given out"
    direction: DOWN
    timeout: 30000
- assertVisible: "Pool 500 · 375 given out · 125 not given out"
- takeScreenshot: 16p-awards-custom-not-all-given-out
- tapOn:
    id: "award-save"
- extendedWaitUntil:
    visible: "125 points weren't given out. Save awards anyway?"
    timeout: 5000
- takeScreenshot: 16q-awards-save-anyway
- tapOn:
    id: "award-save-anyway-yes"
# Save from Complete → Awards goes on to the Final screen: the Awards card, Share + Done, no Results.
- extendedWaitUntil:
    visible: "Awards · .*"
    timeout: 20000
- assertVisible:
    id: "final-done"
- assertVisible:
    id: "final-share"
- assertNotVisible: "Results"
- takeScreenshot: 16r-pool-final-screen-awards
# The header arrow returns to the completed scorecard (Awards replaced Complete under the Final screen).
- back
- extendedWaitUntil:
    visible: "Scorecard( · .*)?"
    timeout: 15000
- assertVisible: "Awarded"
- assertVisible: "Change awards"
- assertVisible:
    id: "pool-awards"
- assertVisible: "Custom · entry 100 · pool 500 · 375 given out"
- takeScreenshot: 16s-pool-scorecard-awarded
# D46 C (Nov 18): Reopen on an awarded pool warns that the awards are cleared. Cancel — the pool stays awarded.
- tapOn: "Scorecard menu"
- tapOn: "Reopen game"
- extendedWaitUntil:
    visible: "Reopen this game?"
    timeout: 5000
- assertVisible:
    id: "reopen-clears-awards"
- takeScreenshot: 16t-reopen-clears-awards
- tapOn: "Cancel"
- assertVisible: "Awarded"
# Clean up: the creator deletes the pool so the Results picker and Home stay as the other flows expect.
- tapOn: "Scorecard menu"
- tapOn: "Delete game"
- extendedWaitUntil:
    visible: "Delete this game?"
    timeout: 5000
- tapOn: "Delete"
- extendedWaitUntil:
    visible: "New game"
    timeout: 20000
