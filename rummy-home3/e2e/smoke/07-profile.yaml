appId: com.mindweavetech.rummyhome
tags: [smoke]
# Profile tab: name, Player ID, Appearance, Settings, the version line, Log out present.
---
- runFlow: ../lib/ensure-signed-in.yaml
- tapOn: "Your profile"
- extendedWaitUntil:
    visible: "Appearance"
    timeout: 15000
- assertVisible: "Sree Test"
- assertVisible: "Change passcode"
# PR 10b: pencils instead of the big Edit buttons; your initials row; passcode dialog with the
# fields first and the keyboard open — all three fields must stay on screen.
- assertVisible: "Edit name"
- assertVisible: "Your initials on scorecards"
- assertVisible:
    id: "me-edit-initials"
- takeScreenshot: 07-profile
- tapOn: "Change passcode"
- extendedWaitUntil:
    visible:
      id: "passcode-current"
    timeout: 15000
- tapOn:
    id: "passcode-current"
- assertVisible:
    id: "passcode-current"
- assertVisible:
    id: "passcode-next"
- assertVisible:
    id: "passcode-confirm"
- takeScreenshot: 07c-change-passcode-keyboard-open
- hideKeyboard
- back
- scrollUntilVisible:
    element:
      text: "App version.*"
    direction: DOWN
    timeout: 10000
- assertVisible: "Log out"
- takeScreenshot: 07b-profile-bottom
# PR 13: Settings holds "New game starts as", the Points defaults and the Pool defaults (limit chips,
# 25 / 50 / 130, Re-entry). Nothing is saved.
- scrollUntilVisible:
    element: "User settings: game type, Drop, Middle drop, Full count"
    direction: UP
    timeout: 10000
- tapOn: "User settings: game type, Drop, Middle drop, Full count"
- extendedWaitUntil:
    visible: "New game starts as"
    timeout: 15000
- assertVisible: "Points defaults"
- takeScreenshot: 07d-settings-points-defaults
- scrollUntilVisible:
    element: "Pool defaults"
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: "settings-pool-limit-101"
- assertVisible:
    id: "settings-pool-limit-custom"
- assertVisible:
    id: "settings-pool-reentry"
- takeScreenshot: 07e-settings-pool-defaults
- back
