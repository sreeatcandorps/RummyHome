appId: com.mindweavetech.rummyhome
tags: [smoke]
# Profile tab: name, Player ID, Appearance, Settings, the version line, Log out present.
---
- runFlow: ../lib/ensure-signed-in.yaml
- tapOn: "Your profile"
- extendedWaitUntil:
    visible: "Appearance"
    timeout: 15000
- assertVisible: "Sree Test"
# D124: Sign-in methods sits under the name: Email, WhatsApp (Add a backup), and Passcode › Change, which moved
# here from Account. Sree has only an email.
- extendedWaitUntil:
    visible: "Sign-in methods"
    timeout: 15000
- assertVisible: "sree@test.local"
- assertVisible: "Add a backup"
- takeScreenshot: 07-profile
# Size-S (D66): grouped rows — Name and Initials with a pen, under Your table, now below Sign-in methods.
- scrollUntilVisible:
    element:
      id: "me-edit-initials"
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: "me-edit-name"
- assertVisible: "Initials on scorecards"
# The passcode dialog with the fields first and the keyboard open — all three fields must stay on screen.
- scrollUntilVisible:
    element:
      id: "me-change-passcode"
    direction: UP
    timeout: 10000
- assertVisible: "Passcode"
- tapOn:
    id: "me-change-passcode"
- extendedWaitUntil:
    visible:
      id: "passcode-current"
    timeout: 15000
- tapOn:
    id: "passcode-current"
- assertVisible:
    id: "passcode-current"
- assertVisible:
    id: "passcode-next"
- assertVisible:
    id: "passcode-confirm"
- takeScreenshot: 07c-change-passcode-keyboard-open
- hideKeyboard
- back
- scrollUntilVisible:
    element:
      text: "App version.*"
    direction: DOWN
    timeout: 10000
- assertVisible: "Log out"
- takeScreenshot: 07b-profile-bottom
# PR 13: Settings holds "New game starts as", the Points defaults and the Pool defaults (limit chips,
# 25 / 50 / 130, Re-entries Unlimited / Limited). Nothing is saved.
- scrollUntilVisible:
    element:
      id: "me-settings"
    direction: UP
    timeout: 10000
- tapOn:
    id: "me-settings"
- extendedWaitUntil:
    visible: "New game starts as"
    timeout: 15000
- assertVisible: "Points defaults"
- takeScreenshot: 07d-settings-points-defaults
# PR 14: the Points group has a Multiplier field, so the pool limit row sits a screen lower; scroll to the segment itself.
- scrollUntilVisible:
    element:
      id: "settings-pool-limit-101"
    direction: DOWN
    timeout: 15000
- assertVisible: "Pool defaults"
- assertVisible:
    id: "settings-pool-limit-custom"
# Scroll to the line under the segmented row so the row is fully on screen before tapping (a tap on a
# half-visible row at the bottom edge was lost on Pixel 6).
- scrollUntilVisible:
    element:
      text: "Out players may re-enter as often as they like.*"
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: "settings-pool-reentries-unlimited"
# 042: Re-entries is Unlimited by default; Limited reveals the count field, nothing is saved.
- tapOn:
    id: "settings-pool-reentries-limited"
# The count field appears below the segmented row and can land under the nav bar: scroll to it, don't assume.
- scrollUntilVisible:
    element:
      id: "settings-pool-reentries-count"
    direction: DOWN
    timeout: 10000
# PR 24: switching to Limited leaves the count empty (the hint under the field asks for it) instead of
# guessing a number. The hint sits under the field, so scroll to it rather than assume it is on screen.
- scrollUntilVisible:
    element:
      text: "Type how many re-entries each player gets (0–99)."
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: "settings-pool-reentries-count"
- assertNotVisible:
    id: "settings-pool-reentries-count"
    text: "[0-9]+"
- takeScreenshot: 07e-settings-pool-defaults-limited
- tapOn:
    id: "settings-pool-reentries-unlimited"
- assertNotVisible:
    id: "settings-pool-reentries-count"
- takeScreenshot: 07e-settings-pool-defaults
# PR 24: Re-entry score (inside the Re-entries group) and Late entry (its own group), both default
# to Highest score + 1; the other choice is Highest score. Nothing is saved.
# Size-S (D67): the "where they start" hints moved behind each group's ⓘ; scroll to the segment ids.
- scrollUntilVisible:
    element:
      id: "settings-pool-reentry-score-plus-one"
    direction: DOWN
    timeout: 10000
- assertVisible: "Re-entry score"
- assertVisible:
    id: "settings-pool-reentry-score-highest"
- assertVisible:
    id: "settings-pool-reentry-score-plus-one"
- scrollUntilVisible:
    element:
      id: "settings-pool-late-entry-score-plus-one"
    direction: DOWN
    timeout: 10000
- assertVisible: "Late entry"
- assertVisible:
    id: "settings-pool-late-entry-score-highest"
- assertVisible:
    id: "settings-pool-late-entry-score-plus-one"
- takeScreenshot: 07f-settings-late-entry-section
- back
