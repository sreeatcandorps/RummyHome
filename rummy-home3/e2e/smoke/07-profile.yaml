appId: com.mindweavetech.rummyhome
tags: [smoke]
# Profile tab: name, Player ID, Appearance, Settings, the version line, Log out present.
---
- runFlow: ../lib/ensure-signed-in.yaml
- tapOn: "Your profile"
- extendedWaitUntil:
    visible: "Appearance"
    timeout: 15000
- assertVisible: "Sree Test"
- assertVisible: "Change passcode"
- takeScreenshot: 07-profile
- scrollUntilVisible:
    element:
      text: "App version.*"
    direction: DOWN
    timeout: 10000
- assertVisible: "Log out"
- takeScreenshot: 07b-profile-bottom
