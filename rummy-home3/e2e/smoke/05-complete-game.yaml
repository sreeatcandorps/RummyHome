appId: com.mindweavetech.rummyhome
tags: [smoke]
# Complete game A from the scorecard: the Complete screen, the confirm, the Completed state.
# Runs after 04-add-round so the game has three rounds. Game A is then a Completed game sree runs,
# which 06-results relies on.
---
- runFlow: ../lib/ensure-signed-in.yaml
- scrollUntilVisible:
    element:
      id: "game-card-GAMEA1"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "game-card-GAMEA1"
- extendedWaitUntil:
    visible: "Scorecard( · .*)?"
    timeout: 15000
- tapOn: "Complete game"
- extendedWaitUntil:
    visible: "Game admins"
    timeout: 15000
- takeScreenshot: 05-complete-screen
- tapOn: "Complete game"
- extendedWaitUntil:
    visible: "Confirm complete game"
    timeout: 5000
- takeScreenshot: 05b-complete-confirm
- tapOn: "Confirm complete game"
- extendedWaitUntil:
    visible: "Share final scores"
    timeout: 20000
- assertVisible: "Go to Results"
- takeScreenshot: 05c-completed
# PR 8 / PR 10b: the Final scores screen shows the standings card (the shared picture, marigold frame)
# and the rounds in blocks of five players with the game total on top. Buttons: Share full details
# (PDF) and Share final scores (image); the header arrow is the only Back; title "Final scores · S…".
- tapOn: "Share final scores"
- extendedWaitUntil:
    visible: "Round by round"
    timeout: 15000
- assertVisible: "Final scores · .*"
- assertVisible:
    id: "final-scores-rounds"
- assertVisible:
    id: "share-rounds"
- assertVisible: "Share full details"
- assertVisible:
    id: "share-final-scores"
# No in-page Back button (the header arrow is the only way back). Not asserted as text: the
# emulator's system navigation bar also exposes a "Back" button to Maestro; the screenshot shows it.
- takeScreenshot: 05d-final-scores
- back
- extendedWaitUntil:
    visible: "Go to Results"
    timeout: 10000
