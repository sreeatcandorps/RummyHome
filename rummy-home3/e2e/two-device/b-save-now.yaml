appId: com.mindweavetech.rummyhome
# Two-device race, step 2 (both emulators at once): tap Save round. One device wins; the other must get
# the conflict notice ("was just saved by …" / "The scorecard changed"), never a second round.
---
- tapOn: "Save round"
- extendedWaitUntil:
    visible:
      text: "Scorecard|Round already saved|was just saved by|The scorecard changed|Could not save round"
    timeout: 30000
- takeScreenshot: t2-after-save-${WHO}
- runFlow:
    when:
      visible: "Back to scorecard"
    commands:
      - tapOn: "Back to scorecard"
- runFlow:
    when:
      visible: "Not yet"
    commands:
      - tapOn: "Not yet"
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
- runFlow:
    when:
      visible: "Save round"
    commands:
      - back
- extendedWaitUntil:
    visible: "Scorecard"
    timeout: 20000
- assertNotVisible: "Something went wrong"
