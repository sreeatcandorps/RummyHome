appId: com.mindweavetech.rummyhome
# Every flow starts here: launch (keeping the saved session), sign in only if the login screen shows,
# and wait for Home. Flows therefore work alone and in any order.
---
- launchApp
- extendedWaitUntil:
    visible:
      # Home, or anything that only the sign-in screen shows. The "Sign in" button alone is not enough: the
      # email field focuses itself 350 ms after the screen opens, and on the 360-dp phone at font 1.3 the
      # keypad (with its "Suggest contact names?" strip) then covers the button, so it is not in the screen's
      # hierarchy at all (small-phone runs on #151 and #147, Nov 26: every flow failed here). The subtitle
      # and the field's own label stay above the keypad whichever way the phone is held.
      text: "New game|Sign in.*|Email"
    timeout: 30000
- runFlow:
    when:
      visible:
        id: "login-email"
    file: sign-in.yaml
- extendedWaitUntil:
    visible: "New game"
    timeout: 30000
- extendedWaitUntil:
    notVisible: "Loading your games"
    timeout: 20000
