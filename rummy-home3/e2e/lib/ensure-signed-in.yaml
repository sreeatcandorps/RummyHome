appId: com.mindweavetech.rummyhome
# Every flow starts here: launch (keeping the saved session), sign in only if the login screen shows,
# and wait for Home. Flows therefore work alone and in any order.
---
- launchApp
- extendedWaitUntil:
    visible:
      # Sign in's subtitle as well as its button: with the keypad up on a 360-dp phone at font 1.3 the button
      # can sit under it (the small-phone run on #151, Nov 26).
      text: "New game|Sign in|Sign in to keep score.*"
    timeout: 30000
- runFlow:
    when:
      visible:
        id: "login-email"
    file: sign-in.yaml
- extendedWaitUntil:
    visible: "New game"
    timeout: 30000
- extendedWaitUntil:
    notVisible: "Loading your games"
    timeout: 20000
