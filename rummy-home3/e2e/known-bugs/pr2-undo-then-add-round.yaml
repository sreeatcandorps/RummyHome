appId: com.mindweavetech.rummyhome
tags: [known-bug, pr2]
# PR 2 (P1): after Undo, Add round must save the same round number again.
# Today: save_round inserts round N while the undone row still holds (game_id, N) -> 23505 ->
# "Round already saved ... by someone else". Expected to be RED until PR 2 lands.
# Fixture: game E (GAMEE1), 4 players, round 1 saved; sree is creator and seated.
---
- runFlow: ../lib/ensure-signed-in.yaml
- tapOn:
    id: "game-card-GAMEE1"
- extendedWaitUntil:
    visible: "Scorecard"
    timeout: 15000
- assertVisible: "Round 2"
- tapOn: "Undo round"
- extendedWaitUntil:
    visible: "Remove the last round?"
    timeout: 5000
- tapOn: "Remove"
- extendedWaitUntil:
    visible: "Round 1"
    timeout: 15000
- takeScreenshot: pr2-after-undo
- tapOn: "Add round"
- extendedWaitUntil:
    visible: "Save round"
    timeout: 15000
- assertVisible: "Round 1"
- tapOn: "Sree Test, no score"
- tapOn: "Drop -10"
- tapOn: "Harish Test, no score"
- tapOn: "Middle drop -30"
- tapOn: "Zed Zero, no score"
- tapOn: "Drop -10"
- tapOn: "Priya Test, no score"
- tapOn: "Rummy"
- assertVisible: "Balance 0"
- tapOn: "Save round"
- extendedWaitUntil:
    visible:
      text: "Round 2|Round already saved"
    timeout: 20000
- assertNotVisible: "Round already saved"
- assertVisible: "Round 2"
- assertVisible: "Add round"
- takeScreenshot: pr2-round-1-saved-again
