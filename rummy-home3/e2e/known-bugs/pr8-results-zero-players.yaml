appId: com.mindweavetech.rummyhome
tags: [known-bug, pr8]
# PR 8: a completed game with seated players but no saved rounds must show its players in a saved
# result ("1 game · 6 players"). Today declare_game_result builds standings from score rows only,
# so the saved result says "1 game · 0 players". Expected RED until PR 8 lands.
# Fixture: game G (GAMEG1), completed, 6 seated, 0 rounds, sree creator. Game A is unticked first
# when it is listed (it is Completed and ticked by default once smoke/05 has run).
---
- runFlow: ../lib/ensure-signed-in.yaml
- tapOn: "Results"
- extendedWaitUntil:
    visible: "Show results"
    timeout: 15000
- runFlow:
    when:
      visible:
        id: "game-card-GAMEA1"
    commands:
      - tapOn:
          id: "game-card-GAMEA1"
- assertVisible:
    id: "game-card-GAMEG1"
- tapOn: "Show results"
- extendedWaitUntil:
    visible: "Totals"
    timeout: 20000
- assertVisible: "1 game · 6 players"
- takeScreenshot: pr8-results-preview-no-rounds
- tapOn:
    id: "results-save-button"
- extendedWaitUntil:
    visible: "OK, open the saved result"
    timeout: 20000
- tapOn: "OK, open the saved result"
- extendedWaitUntil:
    visible: "Totals"
    timeout: 20000
- takeScreenshot: pr8-results-saved-no-rounds
- assertVisible: "1 game · 6 players"
