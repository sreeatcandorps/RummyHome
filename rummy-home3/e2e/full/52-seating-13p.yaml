      id: "picker-row-1"
      text: "Add Test Lima"
    timeout: 15000
# 12o: Next rides on top of the keyboard (it sat under it on the Pixel 6, Nov 27), alone: the two tiles come back
# when the keyboard closes.
- assertVisible:
    id: "new-game-next"
- extendedWaitUntil:
    visible: "Next · 13 players"
    timeout: 15000
- tapOn:
    id: "new-game-next"
- extendedWaitUntil:
    visible: "Game type"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "new-game-type-next"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "new-game-type-next"
# Order of players: thirteen grey discs in pick order from the top (Sree at 12 o'clock, Test Lima one step right).
- extendedWaitUntil:
    visible:
      id: "seat-row-13"
    timeout: 20000
- assertVisible:
    id: "order-counter"
    text: "0 of 13 numbered"
- assertVisible:
    id: "seat-row-1"
    text: "Not numbered, Sree Test"
- assertVisible:
    id: "seat-row-13"
    text: "Not numbered, Test Lima"
# Position 13 always holds the last picked player still waiting: thirteen taps there number everyone, highest first.
# The position stays put while the players move, so each tap waits only 1 s for the glide.
- tapOn:
    id: "seat-row-13"
    waitToSettleTimeoutMs: 1000
- tapOn:
    id: "seat-row-13"
    waitToSettleTimeoutMs: 1000
- tapOn:
    id: "seat-row-13"
    waitToSettleTimeoutMs: 1000
- tapOn:
    id: "seat-row-13"
    waitToSettleTimeoutMs: 1000
- tapOn:
    id: "seat-row-13"
    waitToSettleTimeoutMs: 1000
- tapOn:
    id: "seat-row-13"
    waitToSettleTimeoutMs: 1000
- tapOn:
    id: "seat-row-13"
    waitToSettleTimeoutMs: 1000
- tapOn:
    id: "seat-row-13"
    waitToSettleTimeoutMs: 1000
- tapOn:
    id: "seat-row-13"
    waitToSettleTimeoutMs: 1000
- tapOn:
    id: "seat-row-13"
    waitToSettleTimeoutMs: 1000
- tapOn:
    id: "seat-row-13"
    waitToSettleTimeoutMs: 1000
- tapOn:
    id: "seat-row-13"
    waitToSettleTimeoutMs: 1000
- assertVisible:
    id: "order-counter"
    text: "12 of 13 numbered"
- tapOn:
    id: "seat-row-13"
    waitToSettleTimeoutMs: 1000
- assertVisible:
    id: "order-counter"
    text: "Everyone numbered"
- assertVisible:
    id: "seat-row-1"
    text: "Seat 13, Test Lima"
- assertVisible:
    id: "seat-row-2"
    text: "Seat 12, Test Kilo"
- assertVisible:
    id: "seat-row-13"
    text: "Seat 1, Sree Test, deals next"
- assertVisible:
    id: "seat-label-13"
    text: "ST"
- assertVisible:
    id: "seat-number-13"
    text: "1"
- assertVisible:
    id: "seat-deals-next"
    text: "Dealer"
- assertVisible:
    id: "seat-deal-direction"
- extendedWaitUntil:
    visible:
      id: "seat-deals-line"
      text: "You deal round 1"
    timeout: 10000
- assertNotVisible:
    id: "seat-selected"
- takeScreenshot: 13p-order-everyone-numbered
# Select Test Foxtrot (position 7, seat 7): his name and ▲ ▼ in the middle, the others dimmed; nobody else has arrows.
- tapOn:
    id: "seat-row-7"
- extendedWaitUntil:
    visible:
      id: "seat-selected-name"
      text: "Test Foxtrot"
    timeout: 10000
- assertVisible:
    id: "seat-up-7"
- assertVisible:
    id: "seat-down-7"
- assertNotVisible:
    id: "seat-up-6"
- takeScreenshot: 13p-order-selected-arrows
- tapOn:
    id: "seat-row-7"
- assertNotVisible:
    id: "seat-selected"
# Sideways (D89: no design of its own): the ring keeps its discs whole and the page scrolls.
- setOrientation: LANDSCAPE_LEFT
- extendedWaitUntil:
    visible:
      id: "seat-row-1"
    timeout: 15000
- takeScreenshot: 13p-order-landscape
- setOrientation: PORTRAIT
- runFlow: ../lib/stand-upright.yaml
# Leave without starting: Back to Game type, Back to the players, Back out of New game (the draft is forgotten).
- back
- extendedWaitUntil:
    visible: "Game type"
    timeout: 15000
- back
- extendedWaitUntil:
    visible: "Add by initials"
    timeout: 15000
- back
- runFlow: ../lib/home-top.yaml
