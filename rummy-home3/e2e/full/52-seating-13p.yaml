appId: com.mindweavetech.rummyhome
tags: [nightly]
# D138 at 13 players (Sree, Nov 27: "Make your design work for up to 13"). New game with Sree and twelve of
# game F's placeholders (Test Alpha … Test Lima, in sree's My players from seed-e2e.sql), picked through the
# search box so the list's sort order does not matter → Game type → Next → Order of players: thirteen grey
# discs. Tapping ring position 13 (one step right of the top) thirteen times numbers them from the last
# picked down: Test Lima seat 13 at 12 o'clock … Test Alpha seat 2, Sree seat 1 — one step right of the top,
# the Dealer ("You deal round 1"). Then Test Foxtrot (seat 7) is selected: ▲ ▼ in the middle for him alone.
# Last, the same screen turned sideways (D89: no design of its own, the ring scrolls). No game is started:
# leaving New game forgets the draft, so nothing is left behind for other flows.
---
- runFlow: ../lib/ensure-signed-in.yaml
- tapOn: "New game"
- extendedWaitUntil:
    visible: "Add by initials"
    timeout: 15000
- tapOn: "Add Sree Test (you)"
# Each pick: clear the field first (the keyboard can keep the last word and join it to the next, small phone
# Nov 27: "Test HotelG"); wait for the one result, row 1, by its id and label (the search box's own text is
# "Test X", never "Add Test X"). The keyboard stays up for every pick: since batch row 12o the page shrinks above
# it and the chips take one sideways row while it is up, so the result sits right under the search (before, after
# seven chips on the small phone it sat under the keys, Nov 27). The pick is confirmed by the row leaving the list.
# A pick leaves the picker animating for ~10 s, so the tap waits 1 s for the screen to settle.
- tapOn:
    id: "picker-search"
- eraseText: 15
- inputText: "Test Alpha"
- extendedWaitUntil:
    visible:
      id: "picker-row-1"
      text: "Add Test Alpha"
    timeout: 15000
- tapOn:
    id: "picker-row-1"
    text: "Add Test Alpha"
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    notVisible:
      id: "picker-row-1"
      text: "Add Test Alpha"
    timeout: 15000
- tapOn:
    id: "picker-search"
- eraseText: 15
- inputText: "Test Bravo"
- extendedWaitUntil:
    visible:
      id: "picker-row-1"
      text: "Add Test Bravo"
    timeout: 15000
- tapOn:
    id: "picker-row-1"
    text: "Add Test Bravo"
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    notVisible:
      id: "picker-row-1"
      text: "Add Test Bravo"
    timeout: 15000
- tapOn:
    id: "picker-search"
- eraseText: 15
- inputText: "Test Charlie"
- extendedWaitUntil:
    visible:
      id: "picker-row-1"
      text: "Add Test Charlie"
    timeout: 15000
- tapOn:
    id: "picker-row-1"
    text: "Add Test Charlie"
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    notVisible:
      id: "picker-row-1"
      text: "Add Test Charlie"
    timeout: 15000
- tapOn:
    id: "picker-search"
- eraseText: 15
- inputText: "Test Delta"
- extendedWaitUntil:
    visible:
      id: "picker-row-1"
      text: "Add Test Delta"
    timeout: 15000
- tapOn:
    id: "picker-row-1"
    text: "Add Test Delta"
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    notVisible:
      id: "picker-row-1"
      text: "Add Test Delta"
    timeout: 15000
- tapOn:
    id: "picker-search"
- eraseText: 15
- inputText: "Test Echo"
- extendedWaitUntil:
    visible:
      id: "picker-row-1"
      text: "Add Test Echo"
    timeout: 15000
- tapOn:
    id: "picker-row-1"
    text: "Add Test Echo"
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    notVisible:
      id: "picker-row-1"
      text: "Add Test Echo"
    timeout: 15000
- tapOn:
    id: "picker-search"
- eraseText: 15
- inputText: "Test Foxtrot"
- extendedWaitUntil:
    visible:
      id: "picker-row-1"
      text: "Add Test Foxtrot"
    timeout: 15000
- tapOn:
    id: "picker-row-1"
    text: "Add Test Foxtrot"
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    notVisible:
      id: "picker-row-1"
      text: "Add Test Foxtrot"
    timeout: 15000
# Seven picked with the keyboard up: one sideways row of chips, not three wrapped rows (12o, option A).
- assertVisible:
    id: "selected-strip-one-row"
- tapOn:
    id: "picker-search"
- eraseText: 15
- inputText: "Test Golf"
