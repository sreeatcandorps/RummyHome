appId: com.mindweavetech.rummyhome
tags: [nightly]
# Save a result for game A (completed by smoke/05): the "Result saved" dialog lists the status
# change, the saved result opens, and it appears under Past results.
---
- runFlow: ../lib/ensure-signed-in.yaml
- tapOn: "Results"
- extendedWaitUntil:
    visible: "Show results"
    timeout: 15000
- tapOn: "Show results"
- extendedWaitUntil:
    visible: "Totals"
    timeout: 20000
- tapOn:
    id: "results-save-button"
- extendedWaitUntil:
    visible: "OK, open the saved result"
    timeout: 20000
- assertVisible:
    text: ".*Completed → Closed.*"
- takeScreenshot: 40-result-saved-dialog
- tapOn: "OK, open the saved result"
- extendedWaitUntil:
    visible: "Totals"
    timeout: 20000
- assertVisible:
    text: "1 game · \\d+ players"
- assertNotVisible:
    id: "results-unsaved-banner"
- takeScreenshot: 40b-saved-result
- launchApp
- tapOn: "Results"
- extendedWaitUntil:
    visible: "Past results"
    timeout: 15000
- scrollUntilVisible:
    element: "Past results"
    direction: DOWN
    timeout: 10000
- takeScreenshot: 40c-past-results
