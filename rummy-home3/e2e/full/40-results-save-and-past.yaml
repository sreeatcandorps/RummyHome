appId: com.mindweavetech.rummyhome
tags: [nightly]
# Save a result for game A only (completed by smoke/05): the "Result saved" dialog lists the status
# change, the saved result opens, and it appears under Past results. Game G (completed, seeded) is
# unticked when it is still open (smoke/12 saves G's result on a full run, so it is usually closed by now).
# PR 9: Delete this result at the foot → the 10-second toast "Result deleted · S… is Completed again"
# with Undo → Undo restores it ("Result restored · its games are Closed again"). Then Delete on a
# Past results row → the toast runs out → the row sits under Deleted with Restore → Restore.
---
- runFlow: ../lib/ensure-signed-in.yaml
- tapOn: "Results"
- extendedWaitUntil:
    visible: "Select .*games"
    timeout: 15000
- runFlow:
    when:
      visible:
        id: "game-card-GAMEG1"
    commands:
      - tapOn:
          id: "game-card-GAMEG1"
- scrollUntilVisible:
    element:
      id: "show-results"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "show-results"
- extendedWaitUntil:
    visible: "Scores"
    timeout: 20000
- tapOn:
    id: "results-save-button"
- extendedWaitUntil:
    visible: "OK, open the saved result"
    timeout: 20000
- assertVisible:
    text: ".*Completed → Closed.*"
- takeScreenshot: 40-result-saved-dialog
- tapOn: "OK, open the saved result"
- extendedWaitUntil:
    visible: "Scores"
    timeout: 20000
- assertVisible:
    text: "1 game · \\d+ players"
- assertNotVisible:
    id: "results-unsaved-banner"
- takeScreenshot: 40b-saved-result
# Delete this result → Undo toast → Undo.
- scrollUntilVisible:
    element:
      id: "result-delete"
    direction: DOWN
    timeout: 15000
# Edge-to-edge draws the last button under the translucent 3-button bar and a tap at the bottom edge lands on
# the system Home button (#131 run 2 on this flow; smoke/12 run 4 before it): nudge the page up by a third.
- swipe:
    start: 50%, 70%
    end: 50%, 40%
- takeScreenshot: 40c-delete-this-result
- tapOn:
    id: "result-delete"
- extendedWaitUntil:
    visible: "Result deleted · .* Completed again"
    timeout: 15000
- assertVisible: "Undo.*"
- takeScreenshot: 40d-deleted-undo-toast
- tapOn: "Undo.*"
# The "Result restored" toast lasts 3 s while the page reloads, and the page keeps its scroll
# position (foot of the page, History in view): the History row is the durable proof.
- extendedWaitUntil:
    visible: ".*Result restored · .* back to Closed.*"
    timeout: 20000
- takeScreenshot: 40e-restored-by-undo
- launchApp
- tapOn: "Results"
- extendedWaitUntil:
    visible: "Past results"
    timeout: 15000
- scrollUntilVisible:
    element: "Past results"
    direction: DOWN
    timeout: 10000
- takeScreenshot: 40f-past-results
# PR 10b: no Delete on the rows. Open the row → Delete this result on the page → let the toast run
# out → Results → Deleted + Restore → Restore.
- tapOn:
    id: "past-result-.*"
- extendedWaitUntil:
    visible: "Scores"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "result-delete"
    direction: DOWN
    timeout: 15000
# Edge-to-edge draws the last button under the translucent 3-button bar and a tap at the bottom edge lands on
# the system Home button (#131 run 2 on this flow; smoke/12 run 4 before it): nudge the page up by a third.
- swipe:
    start: 50%, 70%
    end: 50%, 40%
- tapOn:
    id: "result-delete"
- extendedWaitUntil:
    visible: "Result deleted · .* Completed again"
    timeout: 15000
- takeScreenshot: 40g-deleted-toast-runs-out
- extendedWaitUntil:
    notVisible: "Result deleted · .* Completed again"
    timeout: 20000
- launchApp
- tapOn: "Results"
- extendedWaitUntil:
    visible: "Past results"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "deleted-result-restore-.*"
    direction: DOWN
    timeout: 10000
- assertVisible: "Deleted"
# PR 11 mini help: the 30-day note sits in the ⓘ beside the Deleted title.
- tapOn: "About Deleted"
- extendedWaitUntil:
    visible: "Got it"
    timeout: 5000
- assertVisible: ".*stay listed for 30 days under \"Deleted\".*"
- takeScreenshot: 40h-past-results-deleted-restore
- tapOn: "Got it"
- assertNotVisible: "Got it"
- tapOn:
    id: "deleted-result-restore-.*"
- extendedWaitUntil:
    visible: "Result restored · its games are Closed again"
    timeout: 15000
- extendedWaitUntil:
    notVisible:
      id: "deleted-result-restore-.*"
    timeout: 20000
- takeScreenshot: 40i-past-results-restored
