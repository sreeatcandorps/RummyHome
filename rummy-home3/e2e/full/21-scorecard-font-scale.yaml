appId: com.mindweavetech.rummyhome
tags: [nightly]
# PR 4: with the phone font at 1.3x (ci/ui/run-flows.sh sets it for any flow named *font-scale*) the
# header box is sized from its three lines, so initials, totals and DEALS stay whole, and the footer
# still shows. Game E (4 players, active — smoke/05 completes game A, and a Completed game has no DEALS)
# portrait, then Game F (20 players): five columns by default (D90), then ⋮ › Columns › Max for the
# narrowest 38-dp columns, and back to 5 so the next flows start from the default.
---
- runFlow: ../lib/ensure-signed-in.yaml
- scrollUntilVisible:
    element:
      id: "game-card-GAMEE1"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "game-card-GAMEE1"
- extendedWaitUntil:
    visible: "Scorecard( · .*)?"
    timeout: 15000
- assertVisible: "HT"
- assertVisible: "DEALS"
- assertVisible: "4 players"
- assertVisible:
    text: "Unique game ID: GAMEE1"
- takeScreenshot: 21-scorecard-4p-font-scale
- back
- scrollUntilVisible:
    element:
      id: "game-card-GAMEF1"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "game-card-GAMEF1"
- extendedWaitUntil:
    visible: "Scorecard( · .*)?"
    timeout: 20000
- assertVisible: "TA"
- assertVisible: "20 players"
- takeScreenshot: 21b-scorecard-20p-font-scale
- tapOn: "Scorecard menu"
- tapOn:
    id: "columns-choice-max"
- extendedWaitUntil:
    notVisible:
      id: "game-menu-columns"
    timeout: 5000
- assertVisible: "TA"
- takeScreenshot: 21c-scorecard-20p-max-font-scale
- tapOn: "Scorecard menu"
- tapOn:
    id: "columns-choice-5"
- extendedWaitUntil:
    notVisible:
      id: "game-menu-columns"
    timeout: 5000
