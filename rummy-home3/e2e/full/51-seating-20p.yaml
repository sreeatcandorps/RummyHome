appId: com.mindweavetech.rummyhome
tags: [nightly]
# PR 24 Order of players (was PR 21 Seating order, X21-8): the 20-player pass, under the D56 countdown
# (Sree, Nov 19: tap from the highest card to the lowest; the last tap is seat 1 and deals; the list
# reads seat 20 at the top down to seat 1). Game F (20 players × 30 rounds, Sree creator) → ⋮ → Order
# of players: twenty rows, prefilled (everyone numbered, arrows on every row; row 1 is seat 20 Test
# Uniform, row 20 is seat 1 Sree), the "30 rounds played" note, the green "deals next" seat (round 30's
# dealer was seat 10, so seat 11 Test Juliet deals next, on row 10); Clear, then tap Test Romeo first
# (seat 20, "highest card", straight to the top), the rest downwards, Sree second to last (seat 2) and
# Test Uniform last (seat 1) → Done → column 1 reads TU and the Log has an important Seating row listing
# all twenty seats. The flow then puts the order back (TU seat 20, Sree seat 1) so game F reads as
# before for full/20, 21, 50.
# Second half, as c3 on the pool BQ1 (6 seats, Player Five out in round 3, Player Six re-entered): the
# subline counts the outs, an out player is movable like anyone else (▼ on seat 5), Cancel saves nothing.
---
- runFlow: ../lib/ensure-signed-in.yaml
- scrollUntilVisible:
    element:
      id: "game-card-GAMEF1"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "game-card-GAMEF1"
- extendedWaitUntil:
    visible: "Scorecard( · .*)?"
    timeout: 20000
- tapOn: "Scorecard menu"
- tapOn:
    id: "game-menu-seating"
- extendedWaitUntil:
    visible:
      id: "seating-sheet"
    timeout: 15000
- assertVisible: "Mid-game · admins only · logged"
- assertVisible: "30 rounds played.*"
# Row 1 is the highest seat (20, Test Uniform); arrows on every numbered row.
- assertVisible:
    id: "seat-name-1"
    text: "Test Uniform"
- assertVisible:
    id: "seat-number-1"
    text: "20"
- assertVisible:
    id: "seat-up-1"
- takeScreenshot: 51-order-20p-top
# Seat 11 (Test Juliet) deals next: round 30's dealer sat at 10. Seat 11 is row 10 (21 - 11).
- scrollUntilVisible:
    element:
      id: "seat-row-10"
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: "seat-name-10"
    text: "Test Juliet"
- assertVisible:
    id: "seat-deals-next"
- takeScreenshot: 51b-order-20p-deals-next
- scrollUntilVisible:
