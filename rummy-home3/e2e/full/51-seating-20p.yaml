    text: "Sree Test"
- assertVisible:
    id: "seat-number-20"
    text: "1"
# The counter sits under the last row, so with twenty players it is on screen only here.
- assertVisible:
    id: "order-counter"
    text: "Everyone numbered"
# Clear: the rows fall back to today's seat order (Sree, Test Alpha … Test Uniform). Tap Test Romeo
# (row 19) first: seat 20, "highest card", straight to the top; nobody deals yet.
- tapOn:
    id: "seating-clear"
- assertVisible:
    id: "order-counter"
    text: "0 of 20 numbered"
- assertNotVisible:
    id: "seat-deals-next"
- scrollUntilVisible:
