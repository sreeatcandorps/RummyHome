- assertVisible:
    id: "seat-name-2"
    text: "Sree Test"
- assertNotVisible:
    id: "seat-up-2"
- takeScreenshot: 51c-order-20p-romeo-highest
# Each tap on row 19 numbers the next unnumbered player downwards (Test Quebec 19 … Test Alpha 3, then
