appId: com.mindweavetech.rummyhome
tags: [nightly]
# PR 24 Order of players (was PR 21 Seating order, X21-8): the 20-player pass, under the D56 countdown,
# drawn as the D138 circle (ring position 1 is 12 o'clock = seat 20; positions run anticlockwise; position
# 20 = seat 1, just right of the top; each disc's label reads "Seat 20, Test Uniform"). Game F (20 players
# × 30 rounds, Sree creator) → ⋮ → Order of players (the full page): twenty discs, prefilled, no arrows at
# rest; selecting the top one shows ▼ only; the "30 rounds played" note; the Dealer mark on the scorecard's
# next dealer (round 30's dealer was seat 10; the deal moves anticlockwise (057), so seat 9 Test Hotel, position
# 12, deals round 31). Clear,
# then tap Test Romeo first (seat 20, straight to the top), the rest downwards, Sree second to last (seat 2)
# and Test Uniform last (seat 1) → Done → column 1 reads TU and the Log has an important Seating row
# listing all twenty seats. The flow then puts the order back (TU seat 20, Sree seat 1) so game F reads as
# before for full/20, 21, 50. Positions 1, 19 and 20 sit at the top of the ring, so the repeated taps need
# no scrolling (on a 360 dp phone at text 1.3 the 20-ring is taller than the screen and the page scrolls).
# Second half, as c3 on the pool BQ1 (6 seats, Player Five out in round 3, Player Six re-entered): the
# subline counts the outs, an out player is movable like anyone else (select, ▼ on seat 5), Cancel saves nothing.
---
- runFlow: ../lib/ensure-signed-in.yaml
- scrollUntilVisible:
    element:
      id: "game-card-GAMEF1"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "game-card-GAMEF1"
- extendedWaitUntil:
    visible: "Scorecard( · .*)?"
    timeout: 20000
- tapOn: "Scorecard menu"
- tapOn:
    id: "game-menu-seating"
- extendedWaitUntil:
    visible:
      id: "seating-sheet"
    timeout: 15000
- assertVisible: "Mid-game · admins only · logged"
- assertVisible: "30 rounds played.*"
# Position 1 (12 o'clock) is the highest seat (20, Test Uniform); no arrows until he is selected, then ▼ only.
- assertVisible:
    id: "seat-row-1"
    text: "Seat 20, Test Uniform"
- assertVisible:
    id: "seat-number-1"
    text: "20"
- assertNotVisible:
    id: "seat-down-1"
- tapOn:
    id: "seat-row-1"
- extendedWaitUntil:
    visible:
      id: "seat-selected-name"
      text: "Test Uniform"
    timeout: 45000
- assertVisible:
    id: "seat-down-1"
- assertNotVisible:
    id: "seat-up-1"
- takeScreenshot: 51-order-20p-top
- tapOn:
    id: "seat-row-1"
# Seat 9 (Test Hotel) deals round 31: round 30's dealer sat at 10 and the deal moves to the seat before (057).
# Seat 9 is position 12 (21 - 9).
- scrollUntilVisible:
    element:
      id: "seat-row-12"
    direction: DOWN
    timeout: 45000
- assertVisible:
    id: "seat-row-12"
    text: "Seat 9, Test Hotel, deals next"
- assertVisible:
    id: "seat-deals-next"
- assertVisible:
    id: "seat-deals-line"
    text: "Test Hotel deals round 31"
- takeScreenshot: 51b-order-20p-deals-next
- scrollUntilVisible:
    element:
      id: "seat-row-20"
    direction: UP
    timeout: 45000
- assertVisible:
    id: "seat-row-20"
    text: "Seat 1, Sree Test"
- assertVisible:
    id: "seat-number-20"
    text: "1"
# Prefilled and untouched the counter under the circle reads "Everyone numbered · order unchanged — Done closes" (#117).
- scrollUntilVisible:
    element:
      id: "order-counter"
    direction: DOWN
    timeout: 45000
- assertVisible:
    id: "order-counter"
    text: "Everyone numbered.*"
# Clear: the discs fall back to today's seat order (Sree, Test Alpha … Test Uniform). Tap Test Romeo
# (position 19) first: seat 20, straight to the top; nobody deals yet.
- tapOn:
    id: "seating-clear"
- assertVisible:
    id: "order-counter"
    text: "0 of 20 numbered"
- assertNotVisible:
    id: "seat-deals-next"
- scrollUntilVisible:
    element:
      id: "seat-row-1"
    direction: UP
    timeout: 45000
- tapOn:
    id: "seat-row-19"
- assertVisible:
    id: "seat-row-1"
    text: "Seat 20, Test Romeo"
- assertVisible:
    id: "seat-number-1"
    text: "20"
- assertVisible:
    id: "seat-row-2"
    text: "Not numbered, Sree Test"
- assertNotVisible:
    id: "seat-up-2"
- takeScreenshot: 51c-order-20p-romeo-highest
# Each tap on position 19 numbers the next unnumbered player downwards (Test Quebec 19 … Test Alpha 3, then
# Sree 2); Test Uniform waits at position 20 and takes seat 1 last.
- tapOn:
    id: "seat-row-19"
- tapOn:
    id: "seat-row-19"
- tapOn:
    id: "seat-row-19"
- tapOn:
    id: "seat-row-19"
- tapOn:
    id: "seat-row-19"
- tapOn:
    id: "seat-row-19"
- tapOn:
    id: "seat-row-19"
- tapOn:
    id: "seat-row-19"
- tapOn:
    id: "seat-row-19"
- tapOn:
    id: "seat-row-19"
- tapOn:
    id: "seat-row-19"
- tapOn:
    id: "seat-row-19"
- tapOn:
    id: "seat-row-19"
- tapOn:
    id: "seat-row-19"
- tapOn:
    id: "seat-row-19"
- tapOn:
    id: "seat-row-19"
- tapOn:
    id: "seat-row-19"
- tapOn:
    id: "seat-row-19"
- tapOn:
    id: "seat-row-20"
# Mid-game the Dealer mark is the scorecard's next dealer, not seat 1: round 30's dealer (Test India) is now
# seat 11, so seat 10 (Test Hotel, position 11) deals round 31 — the next deal follows the new order.
- assertVisible:
    id: "seat-row-20"
    text: "Seat 1, Test Uniform"
- assertVisible:
    id: "seat-number-20"
    text: "1"
- scrollUntilVisible:
    element:
      id: "seat-deals-line"
      text: "Test Hotel deals round 31"
    direction: DOWN
    timeout: 45000
- scrollUntilVisible:
    element:
      id: "seat-row-11"
      text: "Seat 10, Test Hotel, deals next"
    direction: DOWN
    timeout: 45000
- scrollUntilVisible:
    element:
      id: "order-counter"
    direction: DOWN
    timeout: 45000
- assertVisible:
    id: "order-counter"
    text: "Everyone numbered"
- tapOn:
    id: "seating-done"
- extendedWaitUntil:
    notVisible:
      id: "seating-sheet"
    timeout: 120000
- assertVisible:
    id: "score-header-initials-1"
    text: "TU"
- assertVisible:
    id: "score-header-initials-2"
    text: "ST"
- takeScreenshot: 51d-scorecard-20p-uniform-first
# The Log: an important Seating row that names all twenty seats.
- tapOn: "Scorecard menu"
- tapOn:
    id: "game-menu-log"
- extendedWaitUntil:
    visible:
      id: "game-log-first-row"
    timeout: 15000
- assertVisible:
    text: ".*Seating changed · 1 TU · 2 ST · 3 TA.*"
- tapOn:
    id: "game-log-filter-important"
- assertVisible:
    text: ".*Seating changed · 1 TU.*"
- takeScreenshot: 51e-log-seating-20p
- back
- extendedWaitUntil:
    visible: "Scorecard( · .*)?"
    timeout: 15000
# Scrolls in this sheet get 45 s: with the 30-round × 20-player scorecard behind the dialog each hierarchy
# fetch takes 5–9 s, and 15 s ran out two swipes short of row 20 (Pixel 6 full, Nov 26).
# Put the order back (TU seat 20 … Sree seat 1) so game F is unchanged for the other nightly flows:
# Clear (positions: TU, ST, TA … TR), tap TU (position 1, seat 20), then position 20 nineteen times (TR 19 … TA 2,
# Sree 1).
- tapOn: "Scorecard menu"
- tapOn:
    id: "game-menu-seating"
- extendedWaitUntil:
    visible:
      id: "seating-sheet"
    timeout: 15000
- tapOn:
    id: "seating-clear"
- scrollUntilVisible:
    element:
      id: "seat-row-1"
    direction: UP
    timeout: 45000
- tapOn:
    id: "seat-row-1"
- tapOn:
    id: "seat-row-20"
- tapOn:
    id: "seat-row-20"
- tapOn:
    id: "seat-row-20"
- tapOn:
    id: "seat-row-20"
- tapOn:
    id: "seat-row-20"
- tapOn:
    id: "seat-row-20"
- tapOn:
    id: "seat-row-20"
- tapOn:
    id: "seat-row-20"
- tapOn:
    id: "seat-row-20"
- tapOn:
    id: "seat-row-20"
- tapOn:
    id: "seat-row-20"
- tapOn:
    id: "seat-row-20"
- tapOn:
    id: "seat-row-20"
- tapOn:
    id: "seat-row-20"
- tapOn:
    id: "seat-row-20"
- tapOn:
    id: "seat-row-20"
- tapOn:
    id: "seat-row-20"
- tapOn:
    id: "seat-row-20"
- tapOn:
    id: "seat-row-20"
# Back in the old order Test India is seat 10 again, so seat 9 (Test Hotel) still deals round 31.
- assertVisible:
    id: "seat-row-20"
    text: "Seat 1, Sree Test"
- assertVisible:
    id: "seat-number-20"
    text: "1"
- scrollUntilVisible:
    element:
      id: "seat-deals-line"
      text: "Test Hotel deals round 31"
    direction: DOWN
    timeout: 45000
- scrollUntilVisible:
    element:
      id: "order-counter"
    direction: DOWN
    timeout: 45000
- assertVisible:
    id: "order-counter"
    text: "Everyone numbered"
- tapOn:
    id: "seating-done"
- extendedWaitUntil:
    notVisible:
      id: "seating-sheet"
    timeout: 120000
- assertVisible:
    id: "score-header-initials-1"
    text: "ST"
# Column 20 is off the right edge in portrait (five columns by default, D90): swipe the table left, then check it.
- swipe:
    start: 95%, 40%
    end: 5%, 40%
    duration: 1500
- swipe:
    start: 95%, 40%
    end: 5%, 40%
    duration: 1500
- swipe:
    start: 95%, 40%
    end: 5%, 40%
    duration: 1500
- swipe:
    start: 95%, 40%
    end: 5%, 40%
    duration: 1500
- extendedWaitUntil:
    visible:
      id: "score-header-initials-20"
      text: "TU"
    timeout: 15000
- takeScreenshot: 51f-scorecard-20p-restored
# Pool: BQ1 as its creator c3. Out and re-entered seats show as such, and an out player moves like anyone else.
- runFlow:
    file: ../lib/sign-in-as.yaml
    env:
      EMAIL: c3@test.local
- runFlow:
    file: ../lib/open-break-game.yaml
    env:
      CODE: BREAKQ1
- tapOn: "Scorecard menu"
- tapOn:
    id: "game-menu-seating"
- extendedWaitUntil:
    visible:
      id: "seating-sheet"
    timeout: 15000
- assertVisible: "Pool · 6 seats · 1 out"
- assertVisible: "3 rounds played.*"
# Seat 5 (Player Five, out) is position 2 under the countdown (seat 6 at the top), just left of the top.
- assertVisible:
    id: "seat-row-2"
    text: "Seat 5, Player Five.*, out"
- assertVisible:
    id: "seat-number-2"
    text: "5"
- takeScreenshot: 51g-order-pool-outs
# Select him, ▼: Player Five takes seat 4 (position 3); Player Four takes seat 5 (position 2).
- tapOn:
    id: "seat-row-2"
- tapOn:
    id: "seat-down-2"
- assertVisible:
    id: "seat-row-3"
    text: "Seat 4, Player Five.*"
- assertVisible:
    id: "seat-row-2"
    text: "Seat 5, Player Four.*"
- tapOn:
    id: "seating-cancel"
- extendedWaitUntil:
    notVisible:
      id: "seating-sheet"
    timeout: 5000
# Reopen: Player Five is still seat 5.
- tapOn: "Scorecard menu"
- tapOn:
    id: "game-menu-seating"
- extendedWaitUntil:
    visible:
      id: "seating-sheet"
    timeout: 15000
- assertVisible:
    id: "seat-row-2"
    text: "Seat 5, Player Five.*"
- takeScreenshot: 51h-pool-unchanged
- tapOn:
    id: "seating-cancel"
# Back to sree: this flow is the only full flow that signs in as someone else, and the flows after it
# (70, 80) keep whatever session they find. In the nightly 61 resets the session between; on a targeted
# PR run (planner picks 51 and 70 only) it does not — Nov 19 run: 70 and 80 failed on Charan's Home.
- runFlow:
    file: ../lib/sign-in-as.yaml
    env:
      EMAIL: sree@test.local
