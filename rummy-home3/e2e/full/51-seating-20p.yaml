      id: "seat-row-19"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "seat-row-19"
- scrollUntilVisible:
    element:
      id: "seat-row-1"
    direction: UP
    timeout: 15000
- assertVisible:
