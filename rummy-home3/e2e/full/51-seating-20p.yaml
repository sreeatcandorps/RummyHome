appId: com.mindweavetech.rummyhome
tags: [nightly]
# PR 24 Order of players (was PR 21 Seating order, X21-8): the 20-player pass. Game F (20 players × 30
# rounds, Sree creator) → ⋮ → Order of players: twenty rows, prefilled (everyone numbered, arrows on
# every row), the "30 rounds played" note, the green "deals next" seat (round 30's dealer was seat 10,
# so seat 11 deals next); Clear, then tap Test Uniform first (seat 1, moves to the top) and the rest in
# order → Done → column 1 reads TU and the Log has an important Seating row listing all twenty seats.
# The flow then puts TU back at seat 20 so game F reads as before for full/20, 21, 50.
# Second half, as c3 on the pool BQ1 (6 seats, Player Five out in round 3, Player Six re-entered): the
# subline counts the outs, an out player is movable like anyone else (▲ on seat 5), Cancel saves nothing.
---
- runFlow: ../lib/ensure-signed-in.yaml
- scrollUntilVisible:
    element:
      id: "game-card-GAMEF1"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "game-card-GAMEF1"
- extendedWaitUntil:
    visible: "Scorecard( · .*)?"
    timeout: 20000
- tapOn: "Scorecard menu"
- tapOn:
    id: "game-menu-seating"
- extendedWaitUntil:
    visible:
      id: "seating-sheet"
    timeout: 15000
- assertVisible: "Mid-game · admins only · logged"
- assertVisible: "30 rounds played.*"
- assertVisible:
    id: "seat-name-1"
    text: "Sree Test"
- assertVisible:
    id: "seat-up-1"
- takeScreenshot: 51-order-20p-top
# Seat 11 (Test Juliet) deals next: round 30's dealer sat at 10.
