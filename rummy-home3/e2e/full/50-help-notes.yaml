appId: com.mindweavetech.rummyhome
tags: [nightly]
# Every ? on the main screens opens and closes (a sentence from each note is the check: long notes
# open scrolled, so the "Help" title may be off-screen). PR 12 (in-app Help) adds a per-screen flow and
# the wording checks; until then this is the smoke of the notes themselves.
---
- runFlow: ../lib/ensure-signed-in.yaml
- tapOn: "Help"
- extendedWaitUntil:
    visible: ".*Two buttons: Home.*"
    timeout: 5000
- takeScreenshot: 50-help-home
- back
- tapOn: "New game"
- extendedWaitUntil:
    visible: "Add new players"
    timeout: 15000
- tapOn: "Help"
- extendedWaitUntil:
    visible: ".*You can run a game without sitting in it.*"
    timeout: 5000
- takeScreenshot: 50b-help-new-game
- back
- launchApp
- tapOn:
    text: "My players.*"
- extendedWaitUntil:
    visible: "Add new players"
    timeout: 15000
- tapOn: "Help"
- extendedWaitUntil:
    visible: ".*My players is your own list.*"
    timeout: 5000
- takeScreenshot: 50c-help-my-players
- back
- tapOn: "Your profile"
- extendedWaitUntil:
    visible: "Appearance"
    timeout: 15000
- tapOn: "Help"
- extendedWaitUntil:
    visible: ".*Your email is how you sign in.*"
    timeout: 5000
- takeScreenshot: 50d-help-profile
- back
