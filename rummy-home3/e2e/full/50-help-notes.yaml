appId: com.mindweavetech.rummyhome
tags: [nightly]
# PR 11: every ? on the main screens opens that screen's help page (title "Help · <screen>",
# Need to know first) and Back returns to the screen. Then the index and its search.
---
- runFlow: ../lib/ensure-signed-in.yaml
- tapOn: "Help"
- extendedWaitUntil:
    visible: "Help · Home"
    timeout: 5000
- assertVisible: "Need to know"
- takeScreenshot: 50-help-home
# The index link in the header lists every page by group; search narrows it.
- tapOn: "Help index"
- extendedWaitUntil:
    visible: "Help & guide"
    timeout: 5000
- takeScreenshot: 50a-help-index
- tapOn:
    id: "help-search"
- inputText: "awards"
- extendedWaitUntil:
    visible: ".*Awards.*"
    timeout: 5000
- takeScreenshot: 50a2-help-search-awards
- hideKeyboard
- back
- back
- tapOn: "New game"
- extendedWaitUntil:
    visible: "Add by initials"
    timeout: 15000
- tapOn: "Help"
- extendedWaitUntil:
    visible: "Help · New game · Players"
    timeout: 5000
- takeScreenshot: 50b-help-new-game
- back
- launchApp
- tapOn:
    text: "My players.*"
- extendedWaitUntil:
    visible: "Add by initials"
    timeout: 15000
- tapOn: "Help"
- extendedWaitUntil:
    visible: "Help · My players"
    timeout: 5000
- takeScreenshot: 50c-help-my-players
- back
- tapOn: "Your profile"
- extendedWaitUntil:
    visible: "Profile"
    timeout: 15000
# Size-S (#120): Appearance is below the fold at 360 dp × font 1.3; scroll to it.
- scrollUntilVisible:
    element:
      text: "Appearance"
    direction: DOWN
    timeout: 15000
- tapOn: "Help"
- extendedWaitUntil:
    visible: "Help · Me"
    timeout: 5000
- takeScreenshot: 50d-help-profile
- back
- launchApp
- tapOn: "Results"
- extendedWaitUntil:
    visible: "Past results"
    timeout: 15000
- tapOn: "Help"
- extendedWaitUntil:
    visible: "Help · Results"
    timeout: 5000
- takeScreenshot: 50e-help-results
- back
