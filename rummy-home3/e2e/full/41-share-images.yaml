appId: com.mindweavetech.rummyhome
tags: [full]
# PR 10b share pictures, side by side for the eye: the single game's Final scores card (marigold frame,
# "Final scores · S…" title, Share + Done bar, no Back button) and
# the results share dialog (green frame, every player, no code / link / "and N more" on the card).
# Game G is completed with 6 seated players; its saved result exists once smoke/12 has run (the
# nightly runs smoke first). The pixel size of the saved file (1080 wide) cannot be read by Maestro;
# tests/pr10b-apk9-fixes.test.ts pins the render and capture widths instead. Nothing is sent: the
# share sheet is never opened here.
---
- runFlow: ../lib/ensure-signed-in.yaml
- scrollUntilVisible:
    element:
      id: "game-card-GAMEG1"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "game-card-GAMEG1"
- extendedWaitUntil:
    visible: "Scorecard( · .*)?"
    timeout: 20000
# A04: the header share icon opens the one share sheet; Final scores is an entry on it.
- tapOn:
    id: "scorecard-share-icon"
- assertVisible: "Live scorecard link"
- tapOn:
    id: "share-final-scores-option"
- extendedWaitUntil:
    visible: "Final scores · .*"
    timeout: 20000
- assertVisible:
    id: "final-share"
- assertVisible:
    id: "final-done"
- assertNotVisible:
    text: "Back"
- assertVisible: "EZ Score: Rummy game share image"
- assertVisible: "Round by round"
- takeScreenshot: 41-final-scores-game-share-marigold
- scrollUntilVisible:
    element:
      id: "final-scores-totals"
    direction: DOWN
    timeout: 15000
- assertVisible:
    id: "final-scores-legend"
- takeScreenshot: 41b-final-scores-rounds-legend
- back
- extendedWaitUntil:
    visible: "Scorecard( · .*)?"
    timeout: 15000
- launchApp
- tapOn: "Results"
- extendedWaitUntil:
    visible: "Past results"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Open results from .*"
    direction: DOWN
    timeout: 10000
- tapOn: "Open results from .*"
- extendedWaitUntil:
    visible: "Scores"
    timeout: 20000
- tapOn: "Share"
- extendedWaitUntil:
    visible: "Share results"
    timeout: 10000
- assertVisible: "EZ Score: Rummy results share image"
- assertVisible:
    id: "share-games-line"
- assertVisible:
    id: "share-footer"
- assertNotVisible:
    text: "Full details · .*"
- assertNotVisible:
    text: "and .* more.*"
- takeScreenshot: 41c-results-share-dialog-green
- tapOn: "Close"
- extendedWaitUntil:
    visible: "Scores"
    timeout: 10000
