appId: com.mindweavetech.rummyhome
tags: [chaos]
# C16-4 Offline: the runner turns wifi and data off before this flow (file name hook "--net-off").
# A balanced round is saved with no network: the app must say so (Could not save round) and must not
# crash or pretend it saved. BREAKP6 starts at Round 1 and must still be at Round 1 afterwards (c06 checks).
---
- runFlow:
    file: ../lib/sign-in-as.yaml
    env:
      EMAIL: c1@test.local
- runFlow:
    file: ../lib/open-break-game.yaml
    env:
      CODE: BREAKP6
- assertVisible: "Round 1"
- tapOn: "Add round"
- runFlow: ../lib/fill-round-4.yaml
- takeScreenshot: c05-offline-before-save
- tapOn: "Save round"
- extendedWaitUntil:
    visible: "Could not save round"
    timeout: 60000
- assertNotVisible: "Round 2"
- takeScreenshot: c05-offline-save-refused
