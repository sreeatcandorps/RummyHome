appId: com.mindweavetech.rummyhome
tags: [chaos]
# C16-7 Huge numbers: a fifth digit must be ignored (the keypad caps at four), four-digit counts in one
# round (Full count 80, so each asks once) are saved, the header totals must still render and the round
# can be undone. BREAKP1 (after c01: Round 5).
---
- runFlow:
    file: ../lib/sign-in-as.yaml
    env:
      EMAIL: c1@test.local
- runFlow:
    file: ../lib/open-break-game.yaml
    env:
      CODE: BREAKP1
- tapOn: "Add round"
- extendedWaitUntil:
    visible: "Save round"
    timeout: 15000
- tapOn: "Arun Admin, no score"
- tapOn: "9"
- tapOn: "9"
- extendedWaitUntil:
    visible: "Over the Full count"
    timeout: 5000
- tapOn: "Keep -99"
- tapOn: "9"
- tapOn: "9"
- tapOn: "9"
- assertVisible: "Arun Admin, typing -9999, selected"
- takeScreenshot: c04-typing-9999-capped
- tapOn: "Save score"
- assertVisible: "Arun Admin, score -9999"
- tapOn: "Player One, no score"
- tapOn: "8"
- tapOn: "8"
- extendedWaitUntil:
    visible: "Over the Full count"
    timeout: 5000
- tapOn: "Keep -88"
- tapOn: "8"
- tapOn: "8"
- tapOn: "Save score"
- tapOn: "Player Two, no score"
- tapOn: "7"
- tapOn: "7"
- extendedWaitUntil:
    visible: "Over the Full count"
    timeout: 5000
- tapOn: "Keep -77"
- tapOn: "7"
- tapOn: "Save score"
- tapOn: "Mo Khan, no score"
- tapOn: "5"
- tapOn: "Save score"
- tapOn: "Chandra Creator, no score"
- tapOn: "Rummy"
- assertVisible: "Balance 0"
- takeScreenshot: c04-huge-round-balanced
- tapOn: "Save round"
- extendedWaitUntil:
    visible: "Scorecard"
    timeout: 20000
- assertNotVisible: "Something went wrong"
- assertNotVisible: "Could not save round"
- takeScreenshot: c04-scorecard-huge-totals
- tapOn: "Undo round"
- extendedWaitUntil:
    visible: "Remove the last round?"
    timeout: 5000
- tapOn: "Remove"
- extendedWaitUntil:
    visible: "Round 5"
    timeout: 15000
- takeScreenshot: c04-after-undo
